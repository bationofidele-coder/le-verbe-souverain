<style>
/* Concept : un carnet d'orateur sahélien. Indigo des teintures, ocre du kola, papier légèrement bleuté.
   Une colonne de lecture, un seul geste fort par écran (le grand numéro, le cercle du souffle). */
:root {
  --bg: #EDEFF5; --surface: #FFFFFF; --sunk: #E2E5EF; --ink: #121733; --muted: #525A78; --line: #D2D6E4;
  --indigo: #283A9A; --on-indigo: #FFFFFF; --indigo-soft: #E1E5F7;
  --ochre: #9C6210; --ochre-bright: #C98418; --ochre-soft: #F4E6CC;
  --ok: #23714A; --warn: #955800; --bad: #AD2A20;
  --disp: "Gloock", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E1C; --surface: #141A2E; --sunk: #1B2139; --ink: #E7E9F4; --muted: #9AA1C1; --line: #293152;
    --indigo: #94A4FF; --on-indigo: #0B0E1C; --indigo-soft: #1E2650;
    --ochre: #E2A64B; --ochre-bright: #EDB55E; --ochre-soft: #3A2C15;
    --ok: #6DC491; --warn: #E6A853; --bad: #F18B82; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E1C; --surface: #141A2E; --sunk: #1B2139; --ink: #E7E9F4; --muted: #9AA1C1; --line: #293152;
  --indigo: #94A4FF; --on-indigo: #0B0E1C; --indigo-soft: #1E2650;
  --ochre: #E2A64B; --ochre-bright: #EDB55E; --ochre-soft: #3A2C15;
  --ok: #6DC491; --warn: #E6A853; --bad: #F18B82; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app { max-width: 680px; margin: 0 auto; padding-block: 8px 112px; }
h1, h2, h3 { font-family: var(--disp); font-weight: 400; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 1.85rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.2rem; }
p { margin: 0 0 10px; } p:last-child { margin-bottom: 0; }
.muted { color: var(--muted); } .small { font-size: .9rem; } .center { text-align: center; } .pad { padding: 0 4px; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ochre); margin-bottom: 6px; }
.eyebrow.ok { color: var(--ok); } .eyebrow.warn { color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin: 12px 0; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; } .grid2 > .card { margin: 0; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; } .btn-row.center { justify-content: center; }
ul.plain { margin: 0; padding-left: 1.1em; } ul.plain li { margin: 4px 0; }

/* Boutons */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--indigo); background: var(--indigo); color: var(--on-indigo); font: 700 1rem var(--body); cursor: pointer; text-align: center; }
.btn svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
.btn.ghost { background: transparent; color: var(--indigo); }
.btn.ghost svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: .9rem; }
.btn.wide { width: 100%; margin-top: 14px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; } .btn.ghost.danger { background: transparent; color: var(--bad); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.speaking { background: var(--ochre-soft); border-color: var(--ochre); color: var(--ochre); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .icon-btn:focus-visible, summary:focus-visible, .inp:focus-visible { outline: 3px solid var(--ochre-bright); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--indigo); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); font: .92rem var(--body); cursor: pointer; text-align: left; }
.chip.sm { min-height: 36px; padding: 6px 12px; font-size: .86rem; }
.chip.on { background: var(--indigo-soft); border-color: var(--indigo); color: var(--indigo); font-weight: 700; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--ochre-soft); color: var(--ochre); font-size: .8rem; font-weight: 700; white-space: nowrap; }

/* Formulaires */
.lbl { display: block; font-size: .88rem; font-weight: 700; margin: 12px 0 6px; }
.inp { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); font: 1rem/1.5 var(--body); padding: 10px 12px; }
textarea.inp { resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--sunk); flex-wrap: nowrap; }
.seg button { min-width: 42px; min-height: 40px; border: 0; background: transparent; color: var(--ink); font: 700 .95rem var(--body); cursor: pointer; padding: 0 8px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--indigo); color: var(--on-indigo); }
.seg.s3 button { min-width: 0; padding: 0 12px; font-weight: 400; font-size: .88rem; }
.self { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }

/* En-têtes */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px 2px; }
.brand { font-family: var(--disp); font-size: 1.3rem; } .brand em { font-style: normal; color: var(--ochre); }
.date { color: var(--muted); font-size: .88rem; } .date::first-letter { text-transform: uppercase; }

/* Accueil */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; padding: 22px 20px; }
.hero-num { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
.hero-num .big, .note .big { font-family: var(--disp); font-size: 4.2rem; line-height: .9; color: var(--ochre); font-variant-numeric: tabular-nums; }
.hero-num .of, .note .of { color: var(--muted); font-size: .9rem; }
@media (max-width: 460px) { .hero { grid-template-columns: 1fr; } .hero-num { flex-direction: row; align-items: baseline; gap: 8px; } }
.steps-mini { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); }
.steps-mini li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .93rem; }
.steps-mini b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; }
.cowries { display: flex; gap: 6px; }
.cowrie { width: 22px; height: 30px; fill: var(--sunk); stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; }
.cowrie.on { fill: var(--ochre-soft); stroke: var(--ochre); }
.coachnote .lead, .lead { font-size: 1.06rem; }
.tile { text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; }
.tile-num { font-family: var(--disp); font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.quote blockquote { font-family: var(--disp); font-size: 1.28rem; line-height: 1.3; margin: 4px 0 8px; }
.diag-cta { border-color: var(--ochre); }
.diag-list { list-style: none; margin: 0; padding: 0; }
.diag-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 0; border-bottom: 1px solid var(--line); }

/* Parcours */
details.wk summary { display: flex; gap: 14px; align-items: center; cursor: pointer; list-style: none; }
details.wk summary::-webkit-details-marker { display: none; }
.wk-n { font-family: var(--disp); font-size: 1.8rem; color: var(--ochre); min-width: 2.2ch; font-variant-numeric: tabular-nums; }
.wk-t { display: flex; flex-direction: column; } .wk-t small { color: var(--muted); }
details.wk[open] summary { margin-bottom: 10px; }
.sess { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.sess-b { width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; cursor: pointer; }
.sess-b small { display: block; color: var(--muted); font-size: .84rem; }
.sess-b .dot { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; background: var(--sunk); font-variant-numeric: tabular-nums; }
.sess-b .dot svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; }
.sess-b.done .dot { background: var(--indigo); color: var(--on-indigo); }
.sess-b.next { border-color: var(--ochre); } .sess-b.next .dot { background: var(--ochre-soft); color: var(--ochre); }

/* Progrès */
.baobab { width: 100%; max-width: 340px; display: block; margin: 0 auto; }
.baobab .ring { fill: none; stroke: var(--line); stroke-width: 1.2; }
.baobab .wedge { fill: var(--ochre); stroke: var(--surface); stroke-width: 1; }
.baobab .core { fill: var(--indigo); }
.baobab .wl { fill: var(--muted); font: 700 11px var(--body); text-anchor: middle; }
.legend { list-style: none; margin: 14px 0 10px; padding: 0; text-align: left; }
.legend li { display: grid; grid-template-columns: 2ch 1fr 34% 3ch; gap: 8px; align-items: center; padding: 5px 0; font-size: .9rem; }
.legend .ln { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.legend .bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; } .legend .bar i { display: block; height: 100%; background: var(--ochre); border-radius: 4px; }
.legend .lv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
@media (max-width: 460px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { margin: 0; padding: 14px; } .sv { font-family: var(--disp); font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1.1; } .sl { font-size: .82rem; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; } .chart .ax { fill: var(--muted); font: 10px var(--body); }
.chart .area { fill: var(--indigo-soft); } .chart .line { fill: none; stroke: var(--indigo); stroke-width: 2.4; stroke-linejoin: round; } .chart .end { fill: var(--ochre); }
.journal { list-style: none; margin: 0; padding: 0; } .journal li { padding: 12px 0; border-bottom: 1px solid var(--line); }
.phrase { font-family: var(--disp); font-size: 1.12rem; }

/* Ressources */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
.tabs button { flex: none; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: .92rem var(--body); cursor: pointer; }
.tabs button.on { background: var(--indigo); border-color: var(--indigo); color: var(--on-indigo); font-weight: 700; }
details.acc summary { cursor: pointer; font-family: var(--disp); font-size: 1.15rem; }
details.acc dl { margin: 12px 0 0; } details.acc dt { font-weight: 700; margin-top: 10px; } details.acc dd { margin: 2px 0 0; color: var(--muted); }
.lex { list-style: none; margin: 0; padding: 0; } .lex li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.lex .q { font-family: var(--disp); font-weight: 400; font-size: 1.05rem; }
.grains { display: inline-flex; gap: 3px; } .grains i { width: 7px; height: 10px; border-radius: 50%; background: var(--sunk); border: 1px solid var(--line); } .grains i.on { background: var(--ochre); border-color: var(--ochre); }
.coach-out { white-space: pre-wrap; margin-top: 14px; }

/* Séance */
.sess-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 0; background: var(--bg); }
.sess-title { flex: 1; display: flex; flex-direction: column; min-width: 0; } .sess-title b { font-family: var(--disp); font-weight: 400; font-size: 1.15rem; } .sess-title span { color: var(--muted); font-size: .88rem; }
.tick { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.prog7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 2px 0 6px; }
.prog7 button { height: 8px; border-radius: 4px; border: 0; background: var(--sunk); cursor: pointer; padding: 0; }
.prog7 button.past { background: var(--indigo); } .prog7 button.now { background: var(--ochre); }
.planbar { font-size: .9rem; padding: 10px 14px; border-radius: var(--r-sm); background: var(--sunk); margin: 8px 0; display: block; }
.planbar.ok { background: var(--indigo-soft); } .planbar.err { background: var(--ochre-soft); }
.pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ochre); margin-right: 8px; animation: pulse 1.4s ease-in-out infinite; vertical-align: middle; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
.step-nav { display: flex; justify-content: space-between; gap: 10px; margin: 18px 0 8px; }
.step-nav .btn { flex: 1; }
.lesson .example, .better { background: var(--indigo-soft); border-radius: var(--r-sm); padding: 12px 14px; font-family: var(--disp); font-size: 1.08rem; line-height: 1.4; }
.reading { font-family: var(--disp); font-size: 1.15rem; line-height: 1.55; background: var(--bg); border-radius: var(--r-sm); padding: 14px; margin: 10px 0; }
.vire { padding: 12px 0; border-top: 1px solid var(--line); } .vire-t { font-family: var(--disp); font-size: 1.2rem; line-height: 1.35; margin-bottom: 4px; }
.target { border-color: var(--ochre); }
.words { list-style: none; margin: 0; padding: 0; } .word { padding: 12px 0; border-top: 1px solid var(--line); } .word .w { font-family: var(--disp); font-weight: 400; font-size: 1.35rem; }
.flash { border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 16px; text-align: center; }
.flash-f { font-family: var(--disp); font-size: 1.4rem; margin: 6px 0 12px; } .flash-b { font-size: 1.02rem; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; } .grade .btn { padding: 8px; }
.answer { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; padding: 8px 10px; background: var(--indigo-soft); border-radius: var(--r-sm); font-size: .92rem; }
.defi { display: flex; flex-direction: column; gap: 2px; margin: 12px 0; padding: 12px 14px; border-radius: var(--r-sm); background: var(--ochre-soft); }
.defi span { font-size: .74rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ochre); }
.qcard .qtext { font-family: var(--disp); font-size: 1.4rem; line-height: 1.3; }
.method { margin: 0; padding-left: 1.3em; } .method li { margin: 5px 0; }
.big-tick { font-family: var(--disp); font-size: 2.2rem; font-variant-numeric: tabular-nums; line-height: 1; }
.hint { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; color: var(--muted); margin: 14px 0 0; }
.hint svg { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--ochre); stroke-width: 1.8; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 0; }
.metrics div { background: var(--bg); border-radius: var(--r-sm); padding: 8px 10px; min-width: 0; }
.metrics b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; } .metrics span { font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
details.audio { margin-top: 12px; } details.audio summary { cursor: pointer; color: var(--indigo); font-weight: 700; } details.audio audio { width: 100%; margin-top: 8px; }
.coach { margin-top: 16px; padding: 16px; border-radius: var(--r-sm); background: var(--bg); border: 1px solid var(--line); }
.coach-h { font-family: var(--disp); font-size: 1.15rem; margin-bottom: 8px; }
.scores { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.score { font-size: .82rem; padding: 4px 10px; border-radius: 999px; background: var(--sunk); }
.score.s4, .score.s5 { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.score.s1, .score.s2 { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.corr { list-style: none; margin: 4px 0 12px; padding: 0; }
.corr li { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.corr s { color: var(--muted); } .corr .arrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ochre); } .corr small { color: var(--muted); }
.chat { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.bub { max-width: 86%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; }
.bub.them { align-self: flex-start; background: var(--sunk); border-bottom-left-radius: 4px; }
.bub.me { align-self: flex-end; background: var(--indigo); color: var(--on-indigo); border-bottom-right-radius: 4px; }
.bub.typing { color: var(--muted); }
.palabre { border-color: var(--ochre); }
.arena h2 { font-size: 1.6rem; }
.bilan .note { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; }

/* Respiration : l'onde d'indigo */
.breath { display: grid; place-items: center; padding: 18px 0 10px; }
.breath-c { --dur: 4s; width: 210px; height: 210px; max-width: 100%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(circle, var(--indigo-soft) 0 52%, transparent 53%), repeating-radial-gradient(circle, color-mix(in srgb, var(--indigo) 22%, transparent) 0 2px, transparent 2px 14px);

  { t: "Le trac est une énergie, pas un ennemi", sci: "Chercher à se calmer à tout prix fonctionne mal. Requalifier l’activation en enthousiasme (« je suis enthousiaste ») améliore la performance orale (Brooks, Harvard Business School, 2014). Une expiration plus longue que l’inspiration apaise le corps sans éteindre l’élan.", pr: "Au moment où le cœur s’accélère, dites : « Je suis prêt, c’est de l’énergie. » Puis expirez deux fois plus longtemps que vous n’inspirez.", f: "Mon cœur bat parce que cela compte. Tant mieux." },
  { t: "Les pièges de la pensée", sci: "La peur du jugement s’alimente de pensées automatiques : lire dans les pensées (« ils me trouvent nul »), dramatiser (« je vais tout rater »), le tout ou rien. Les thérapies cognitives apprennent à les repérer, les examiner, les reformuler.", pr: "Écrivez une pensée qui vous freine, le piège qu’elle contient, puis une version plus juste. Exemple : « Ils vont me juger » devient « Ils sont là pour l’information, pas pour me noter ».", f: "Une pensée n’est pas un fait. Je l’examine, puis je parle." },
  { t: "Servir plutôt que briller", sci: "L’anxiété grandit quand l’attention se tourne vers soi. Les spécialistes de la parole spontanée (Matt Abrahams, Stanford) recommandent de se concentrer sur ce que l’on apporte à l’auditoire et d’« oser la simplicité » : viser juste plutôt que brillant.", pr: "Avant de parler, répondez en une phrase : « Qu’est-ce que je viens leur apporter ? » Puis parlez pour eux.", f: "Je ne suis pas jugé : je suis utile." },
  { t: "Vider l’inquiétude par l’écriture", sci: "Écrire ses inquiétudes pendant dix minutes avant une épreuve a amélioré les résultats des personnes anxieuses (Ramirez et Beilock, Science, 2011) : l’inquiétude écrite occupe moins la mémoire de travail.", pr: "Avant une échéance importante, écrivez trois minutes, sans vous censurer, tout ce qui vous inquiète. Puis fermez la page et passez à votre première phrase.", f: "J’ai posé mes peurs sur la page ; ma tête est libre pour l’essentiel." },
  { t: "Votre récit de soi", sci: "Pour Marshall Ganz (Harvard), la conviction se transmet par le récit : le choix qui vous a fait, les valeurs qu’il révèle, l’appel qu’il fonde. La confiance devient inébranlable quand elle repose sur le sens, pas sur la performance.", pr: "Écrivez en cinq lignes le moment où vous avez choisi le développement et l’action humanitaire : le défi, le choix, ce qu’il dit de vous.", f: "Je parle depuis ce qui m’a fait. Personne ne peut me l’enlever." },
  { t: "La chaleur avant la compétence", sci: "On fait d’abord confiance à la chaleur, puis on évalue la compétence. Le charisme combine présence, puissance et chaleur (Olivia Fox Cabane). Une vulnérabilité maîtrisée, un sourire des yeux, un prénom retenu rapprochent plus que dix arguments.", pr: "Aujourd’hui, dans trois conversations, retenez et redites le prénom de l’autre, et posez une question sur ce qui le passionne.", f: "Je m’intéresse d’abord ; je convaincs ensuite." },
  { t: "Programmer son calme : « si… alors »", sci: "Les intentions de mise en œuvre (Gollwitzer) consistent à décider à l’avance : « Si telle situation survient, alors je fais ceci. » Elles rendent la réaction automatique quand la pression monte.", pr: "Écrivez trois plans : « Si l’on m’interrompt, alors je souris et je dis : permettez-moi de finir. » « Si l’on m’attaque, alors je respire trois secondes et je reformule. » « Si je perds le fil, alors je reprends ma dernière idée. »", f: "J’ai déjà décidé comment je réagirai. Rien ne me surprend." },
  { t: "Oser le désaccord sans agresser", sci: "L’affirmation de soi consiste à défendre sa position en respectant l’autre. La méthode DESC (Bower et Bower) : Décrire les faits, Exprimer son point de vue, Spécifier sa demande, annoncer les Conséquences positives.", pr: "Préparez un désaccord réel avec la méthode DESC, et dites-le à voix haute deux fois, calmement.", f: "Je peux être en désaccord et rester bienveillant. Les deux me grandissent." },
  { t: "La répétition mentale du chemin", sci: "Se représenter mentalement le déroulement concret d’une tâche (et non seulement le succès final) améliore la préparation et la performance (Pham et Taylor, 1999).", pr: "Les yeux fermés, vivez deux minutes votre prochaine échéance : l’entrée, la première phrase, la question difficile, votre réponse calme, la dernière phrase.", f: "Je l’ai déjà vécu en esprit. Demain, je le refais pour de vrai." },
  { t: "Devenir l’orateur, jour après jour", sci: "Une habitude met en moyenne soixante-six jours à s’installer, avec de grandes variations selon les personnes (Lally et al., 2010). Manquer un jour ne compromet rien ; la règle des persévérants : ne jamais manquer deux fois de suite.", pr: "Écrivez la phrase d’identité qui résume ces douze semaines, puis prévoyez vos trois prochaines prises de parole réelles.", f: "Je ne m’entraîne plus à parler : je suis un orateur qui s’entraîne." }
];

const Store = {
  mode: "local", db: null, uid: null, q: {}, timers: {},
  lk: k => "vs1:" + k,
  readLocal(k) { try { const v = localStorage.getItem(this.lk(k)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  writeLocal(k, v) { try { localStorage.setItem(this.lk(k), JSON.stringify(v)); } catch (e) { } },
  async connect() {
    try {
      if (!window.claude || !window.claude.use) return this.mode;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const uid = user ? await user.id() : null;
      if (db && uid) { this.db = db; this.uid = uid; this.mode = "db"; }
    } catch (e) { }
    return this.mode;
  },
  ref(k) { return this.db.doc("data/users/" + this.uid + "/" + k); },
  async get(k) {
    if (this.mode !== "db") return this.readLocal(k);
    try {
      const s = await this.ref(k).get();
      if (s.exists) { const v = JSON.parse(JSON.stringify(s.data())); this.writeLocal(k, v); return v; }
      const loc = this.readLocal(k);
      if (loc) this.set(k, loc);
      return loc;
    } catch (e) { return this.readLocal(k); }
  },
  set(k, v) {
    this.writeLocal(k, v);
    if (this.mode !== "db") return Promise.resolve();
    const body = JSON.parse(JSON.stringify(v));
    const prev = this.q[k] || Promise.resolve();
    const p = prev.then(() => this.ref(k).set(body)).catch(async e => {
      const c = e && e.code;
      if (c === "unavailable") { await sleep(700 + Math.random() * 900); try { await this.ref(k).set(body); } catch (_) { } }
      else if (c === "invalid_argument" || c === "revoked" || c === "not_granted" || c === "capability_disabled") {
        this.mode = "local"; toast("Sauvegarde en ligne indisponible : la progression reste sur cet appareil.");
      } else if (c === "quota_exceeded") toast("Espace de sauvegarde plein.");
    });
    this.q[k] = p; return p;
  },
  soon(k, getter, ms = 1500) {
    clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => this.set(k, getter()), ms);
  },
  flush(k, v) { clearTimeout(this.timers[k]); return this.set(k, v); }
};

const TTS = {
  ok: typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined",

  pick() { try { const vs = speechSynthesis.getVoices(); this.voice = vs.find(v => /^fr[-_]FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null; } catch (e) { } },
  speak(text, rate = 1, onend) {
    if (!this.ok) return false;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/\s\/\s/g, ", ").replace(/[«»]/g, ""));
      u.lang = "fr-FR"; if (!this.voice) this.pick(); if (this.voice) u.voice = this.voice;
      u.rate = rate; u.onend = onend || null; u.onerror = onend || null;
      speechSynthesis.speak(u); return true;
    } catch (e) { return false; }
  },
  stop() { try { if (this.ok) speechSynthesis.cancel(); } catch (e) { } }
};

const FILL_RE = /(?<![\p{L}])(euh+|heu+|hum+|ben|bah|du coup|en fait|voilà|genre|tu vois|vous voyez|quoi|bref|j[’']veux dire|disons|comment dire)(?![\p{L}])/giu;
function speechMetrics(text, sec) {
  const words = (text || "").trim().split(/\s+/).filter(Boolean).length;
  const fills = ((text || "").match(FILL_RE) || []).map(s => s.toLowerCase());
  const wpm = sec >= 10 && words >= 10 ? Math.round(words / (sec / 60)) : 0;
  return { words, fills, wpm, sec: Math.round(sec || 0) };
}

function normCorrection(r, comps) {
  const scores = {};
  comps.forEach(c => { const v = Number(r && r.scores && r.scores[c]); if (v >= 1 && v <= 5) scores[c] = Math.round(v); });
  const corr = Array.isArray(r && r.corrections) ? r.corrections.filter(x => x && (x.avant || x.apres)).slice(0, 5).map(x => ({ avant: str(x.avant), apres: str(x.apres), pourquoi: str(x.pourquoi) })) : [];
  const cp = r && r.corps && typeof r.corps === "object" ? r.corps : null;
  const corps = cp ? { posture: str(cp.posture), gestuelle: str(cp.gestuelle), regard: str(cp.regard), visage: str(cp.visage), cadrage: str(cp.cadrage), exercice: str(cp.exercice) } : null;
  return { scores, verdict: str(r && r.verdict), forces: strArr(r && r.forces, 3), corrections: corr, version: str(r && r.versionAmelioree), phrase: str(r && r.phraseAMemoriser), conseil: str(r && r.conseil), voix: str(r && r.voix), corps };
}

// ---------- Analyse acoustique (fonction pure, testable) ----------
function quant(arr, q) { if (!arr.length) return 0; const s = Array.from(arr).sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.max(0, Math.floor(q * (s.length - 1))))]; }
function analyzePCM(x, sr) {
  const hop = Math.round(sr * 0.02), win = hop * 2, fs = 0.02;
  const nF = Math.max(0, Math.floor((x.length - win) / hop));
  if (nF < 25) return null;
  const db = new Float32Array(nF);
  for (let f = 0; f < nF; f++) { let s = 0; const o = f * hop; for (let i = 0; i < win; i++) { const v = x[o + i]; s += v * v; } db[f] = 10 * Math.log10(s / win + 1e-12); }
  const floor = quant(db, 0.1), top = quant(db, 0.95);
  const thr = floor + Math.max(6, (top - floor) * 0.3);
  const sp = new Uint8Array(nF); for (let f = 0; f < nF; f++) sp[f] = db[f] > thr ? 1 : 0;
  // combler les micro-trous (< 150 ms) et retirer les bruits isolés (< 80 ms)
  const runs = () => { const r = []; let s = 0; for (let f = 1; f <= nF; f++) if (f === nF || sp[f] !== sp[s]) { r.push([s, f, sp[s]]); s = f; } return r; };
  runs().forEach(([a, b, v]) => { if (!v && b - a < 8 && a > 0 && b < nF) for (let f = a; f < b; f++) sp[f] = 1; });
  runs().forEach(([a, b, v]) => { if (v && b - a < 4) for (let f = a; f < b; f++) sp[f] = 0; });
  let first = sp.indexOf(1), last = sp.lastIndexOf(1);
  if (first < 0) return { silent: true, dur: x.length / sr };
  const R = runs();
  const pauses = R.filter(([a, b, v]) => !v && a > first && b <= last && (b - a) * fs >= 0.35).map(([a, b]) => (b - a) * fs);
  let speechF = 0; for (let f = 0; f < nF; f++) speechF += sp[f];
  const speechSec = speechF * fs, activeSec = (last - first + 1) * fs;
  // Hauteur (F0) par autocorrélation normalisée
  const lagMin = Math.floor(sr / 400), lagMax = Math.ceil(sr / 70);
  const f0 = new Float32Array(nF);
  const seg = new Float32Array(win);
  for (let f = 0; f < nF; f += 2) {
    if (!sp[f]) continue;
    const o = f * hop; let mean = 0; for (let i = 0; i < win; i++) mean += x[o + i]; mean /= win;
    let r0 = 0; for (let i = 0; i < win; i++) { seg[i] = x[o + i] - mean; r0 += seg[i] * seg[i]; }
    if (r0 <= 1e-9) continue;
    let best = 0, bl = 0; const nc = [];
    for (let lag = lagMin; lag <= lagMax && lag < win - 8; lag++) {
      let r = 0, e1 = 0, e2 = 0; for (let i = 0; i < win - lag; i++) { r += seg[i] * seg[i + lag]; e1 += seg[i] * seg[i]; e2 += seg[i + lag] * seg[i + lag]; }
      const n = r / Math.sqrt(e1 * e2 + 1e-12); nc.push(n); if (n > best) best = n;
    }
    // premier pic proche du maximum : évite les erreurs d'octave (sous-harmoniques)
    for (let k = 1; k < nc.length - 1; k++) if (nc[k] >= 0.9 * best && nc[k] >= nc[k - 1] && nc[k] >= nc[k + 1]) { bl = lagMin + k; break; }
    if (best > 0.55 && bl) { f0[f] = sr / bl; if (f + 1 < nF) f0[f + 1] = f0[f]; }
  }
  const raw = []; for (let f = 0; f < nF; f += 2) if (f0[f] > 0) raw.push(f0[f]);
  const pv = raw.map((v, i) => quant(raw.slice(Math.max(0, i - 2), i + 3), 0.5));
  let med = 0, rangeSt = 0, sdSt = 0;
  if (pv.length >= 15) {
    med = quant(pv, 0.5);
    const st = pv.map(v => 12 * Math.log2(v / med)).filter(v => Math.abs(v) < 12);
    rangeSt = quant(st, 0.9) - quant(st, 0.1);
    const m = st.reduce((a, b) => a + b, 0) / st.length; sdSt = Math.sqrt(st.reduce((a, b) => a + (b - m) * (b - m), 0) / st.length);
  }
  const vdb = []; for (let f = 0; f < nF; f++) if (sp[f]) vdb.push(db[f]);
  const dyn = quant(vdb, 0.9) - quant(vdb, 0.1);
  // Syllabes : pics d'énergie dans la parole
  const env = new Float32Array(nF); for (let f = 1; f < nF - 1; f++) env[f] = (db[f - 1] + db[f] + db[f + 1]) / 3;
  let syll = 0, lastPk = -99;
  for (let f = 3; f < nF - 3; f++) {
    if (!sp[f]) continue;
    if (env[f] >= env[f - 1] && env[f] > env[f + 1] && env[f] >= env[f - 2] && env[f] >= env[f + 2] && f - lastPk >= 5) {
      let mn = env[f]; for (let k = Math.max(0, f - 6); k < f; k++) mn = Math.min(mn, env[k]);
      if (env[f] - mn >= 2) { syll++; lastPk = f; }
    }
  }
  // Hésitations probables : voyelle tenue, hauteur et énergie plates, isolée par des pauses
  let hes = 0;
  R.forEach(([a, b, v], i) => {
    if (!v) return; const len = b - a; if (len < 13 || len > 60) return;
    const pre = R[i - 1], post = R[i + 1];
    const isolated = (pre && !pre[2] && (pre[1] - pre[0]) >= 10) || (post && !post[2] && (post[1] - post[0]) >= 10);
    if (!isolated) return;
    const fp = []; const ed = [];
    for (let f = a; f < b; f++) { if (f0[f] > 0) fp.push(12 * Math.log2(f0[f] / (med || f0[f]))); ed.push(db[f]); }
    if (fp.length < 6) return;
    const sd = a2 => { const m = a2.reduce((p, q) => p + q, 0) / a2.length; return Math.sqrt(a2.reduce((p, q) => p + (q - m) * (q - m), 0) / a2.length); };
    if (sd(fp) < 0.8 && sd(ed) < 2.5) hes++;
  });
  const bins = 90, tl = [];
  for (let i = 0; i < bins; i++) { const a = Math.floor(i * nF / bins), b = Math.max(a + 1, Math.floor((i + 1) * nF / bins)); let mx = -200, s = 0; for (let f = a; f < b; f++) { mx = Math.max(mx, db[f]); s += sp[f]; } tl.push([Math.round(clamp((mx - floor) / Math.max(1, top - floor), 0, 1) * 100), s / (b - a) > 0.3 ? 1 : 0]); }
  const min = activeSec / 60;
  return {
    dur: Math.round(x.length / sr * 10) / 10, active: Math.round(activeSec * 10) / 10, speech: Math.round(speechSec * 10) / 10,
    ratio: Math.round(speechSec / activeSec * 100) / 100,
    pauses: pauses.length, ppm: min > 0 ? Math.round(pauses.length / min * 10) / 10 : 0,
    longP: pauses.filter(p => p >= 1.2).length, longest: Math.round((pauses.length ? Math.max(...pauses) : 0) * 10) / 10,
    meanP: pauses.length ? Math.round(pauses.reduce((a, b) => a + b, 0) / pauses.length * 100) / 100 : 0,
    f0: Math.round(med), range: Math.round(rangeSt * 10) / 10, sd: Math.round(sdSt * 10) / 10, pitched: pv.length,
    dyn: Math.round(dyn * 10) / 10, syll, sps: speechSec > 0 ? Math.round(syll / speechSec * 10) / 10 : 0,
    hes, hpm: min > 0 ? Math.round(hes / min * 10) / 10 : 0, tl
  };
}

async function decodeToMono(file, sr = 8000) {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) throw new Error("audio");
  const ac = new AC(); const buf = await file.arrayBuffer();
  let audio; try { audio = await ac.decodeAudioData(buf); } finally { try { ac.close(); } catch (e) { } }
  const len = Math.max(1, Math.ceil(audio.duration * sr));
  const off = new OfflineAudioContext(1, len, sr);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const out = await off.startRendering();
  return out.getChannelData(0);
}

// Lecture humaine des mesures, avec seuils indicatifs
function voiceReading(m) {
  if (!m || m.silent) return [];
  const R = [];

const once = (el, ev) => new Promise((res, rej) => { const ok = () => { cl(); res(); }, ko = () => { cl(); rej(new Error(ev)); }; const cl = () => { el.removeEventListener(ev, ok); el.removeEventListener("error", ko); }; el.addEventListener(ev, ok); el.addEventListener("error", ko); });

  const big = document.createElement("canvas"); big.width = W; big.height = H; const bx = big.getContext("2d");
  const sw = 48, sh = Math.max(16, Math.round(sw * H / W));
  const sm = document.createElement("canvas"); sm.width = sw; sm.height = sh; const sx = sm.getContext("2d", { willReadFrequently: true });

    dur, frames,
    motion: {
      index: Math.round(clamp(mean * 9, 0, 100)),
      still: Math.round(act.filter(a => a < 1.2).length / act.length * 100),
      agit: Math.round(act.filter(a => a > 8).length / act.length * 100),

  const sents = t.split(/[.!?…]+/).map(s => s.trim()).filter(s => s.split(/\s+/).length >= 2);
  const lens = sents.map(s => s.split(/\s+/).length);
  const has = arr => { const seen = new Set(); return arr.filter(h => { const k = norm(h); if (seen.has(k) || !(n.includes(" " + k + " ") || n.includes(" " + k + ","))) return false; seen.add(k); return true; }); };
  const words = n.split(/[\s?!.]+/).filter(w => w.length > 1);
  const surf = {}; t.toLowerCase().split(/[^\p{L}’'-]+/u).forEach(w => { const k = norm(w); if (k && !surf[k]) surf[k] = w; });
  const freq = {}; words.forEach(w => { if (w.length >= 5 && !STOP.has(w)) freq[w] = (freq[w] || 0) + 1; });
  const rep = Object.entries(freq).filter(([, c]) => c >= 3).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([w, c]) => (surf[w] || w) + " ×" + c);
  const sample = words.slice(0, 150); const ttr = sample.length ? Math.round(new Set(sample).size / sample.length * 100) : 0;
  const learned = Object.keys(S.srs.items).filter(id => id.startsWith("w:") || id.startsWith("b:")).map(id => id.slice(2));
  const used = learned.filter(m => { const k = norm(m); const stem = k.length > 6 ? k.slice(0, k.length - 2) : k; return n.includes(" " + stem); });

    hedges: has(HEDGES), connect: has(CONNECT), rep, ttr, used, questions: (t.match(/\?/g) || []).length

}

  }

}

function miniChart(vals, label, unit, goodLow) {
  const pts = vals.map((v, i) => [i, v]).filter(x => typeof x[1] === "number");
  if (pts.length < 1) return "";
  const W = 150, H = 54, ys = pts.map(p => p[1]), mn = Math.min(...ys), mx = Math.max(...ys), span = mx - mn || 1;
  const x = i => 4 + (W - 8) * (pts.length === 1 ? 0.5 : i / (pts.length - 1)), y = v => 6 + (H - 14) * (1 - (v - mn) / span);
  const line = pts.map((p, i) => x(i).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ");
  const first = ys[0], last = ys[ys.length - 1];
  return '<div class="mini"><div class="mini-h">' + esc(label) + '</div><svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="' + esc(label) + '"><polyline class="line" points="' + line + '"/><circle class="end" cx="' + x(pts.length - 1) + '" cy="' + y(last) + '" r="3.5"/></svg><div class="small"><b>' + String(last).replace(".", ",") + '</b> ' + esc(unit) + (pts.length > 1 ? ' <span class="muted">(départ ' + String(first).replace(".", ",") + ')</span>' : "") + '</div></div>';
}

const R = k => { const c = ctx(); return (c.res[k] = c.res[k] || {}); };

async function startSession(n) {
  TTS.stop(); Breath.stop(); Media.clearAll();
  const info = sessionInfo(n);
  let doc = Store.readLocal(sessKey(n));
  if (Store.mode === "db") { const d = await Store.get(sessKey(n)); if (d) doc = d; }
  const resume = doc && doc.status === "en-cours";
  S.cur = { n, info, status: "en-cours", card: resume ? (doc.card || 0) : 0, step: resume ? (doc.step || 0) : 0, startedAt: resume ? doc.startedAt : Date.now(), stepAt: Date.now(), res: resume ? (doc.res || {}) : {}, plan: null, planState: coachOn() ? "loading" : "off", chrono: null };
  S.route = "seance"; render(); saveSess();
  Voice.preload(["c", "w" + pad2(info.w + 1)]);
  if (VOICE_ON()) { const cds = buildCards(S.cur), cd = cds[S.cur.card] || cds[0]; if (!S.profile.done.length && !resume && Voice.has("ui:welcome")) Voice.play("ui:welcome", 1, () => setTimeout(() => Voice.play(cd.auto), 250)); else Voice.play(cd.auto); }
  const plan = await Store.get(planKey(n));
  if (!S.cur || S.cur.n !== n) return;
  if (plan && plan.at) { S.cur.plan = plan; S.cur.planState = "ok"; softRender(); }
  else if (coachOn()) runPrepare(n);
}
async function runPrepare(n) {
  S.cur.planState = "loading"; softRender();

  } catch (e) {
    if (S.cur && S.cur.n === n) { S.cur.planState = coachOn() ? "err" : "off"; S.cur.planErr = coachErr(e); softRender(); }

// ---------- 3. Le Grenier ----------
function todayWords(c, info) {
  const base = info.mots.map(([m, d, e]) => ({ id: "w:" + m, m, def: d, ex: e }));
  const bonus = (c.plan && c.plan.bonus || []).filter(b => !WORD_IX[b.m]).map(b => ({ id: "b:" + b.m, m: b.m, def: b.def, ex: b.ex, bonus: true }));
  return base.concat(bonus);
}
function stepGrenier(c, info) {
  const r = R("grenier"); r.said = r.said || {}; r.rev = r.rev || {}; r.dire = r.dire || 0;
  const words = todayWords(c, info);
  let h = '<section class="card"><div class="eyebrow">Les mots du jour · ' + words.length + '</div><p class="muted small">Lisez chaque mot à voix haute, puis dites la phrase d’exemple en la faisant vôtre.' + (c.planState === "loading" ? " Les mots du coach arrivent." : "") + '</p><ul class="words">' +
    words.map(w => '<li class="word"><div class="row-between"><b class="w">' + esc(w.m) + '</b>' + (w.bonus ? '<span class="pill">Coach</span>' : "") + '</div><p>' + esc(w.def) + '</p><p class="muted small"><i>' + esc(w.ex) + '</i></p><div class="row-wrap">' + speakBtn(w.m + ". " + w.ex, "Écouter") +
      '<button class="chip sm' + (r.said[w.id] ? " on" : "") + '" data-act="said-w" data-id="' + esc(w.id) + '" aria-pressed="' + !!r.said[w.id] + '">Dit à voix haute</button></div></li>').join("") + '</ul></section>';
  // Révision espacée
  if (!r.queue) r.queue = srsDue(8).filter(id => !words.some(w => w.id === id));
  const left = r.queue.filter(id => r.rev[id] === undefined);
  h += '<section class="card"><div class="eyebrow">Révision espacée · ' + (r.queue.length - left.length) + ' / ' + r.queue.length + '</div>';
  if (!r.queue.length) h += '<p class="muted small">Rien à revoir aujourd’hui. Le Grenier se remplit au fil des séances.</p>';
  else if (!left.length) h += '<p>Révision terminée. ' + Object.values(r.rev).filter(g => g === 2).length + ' grains sus sur ' + r.queue.length + '.</p>';

    h += '<div class="flash"><div class="small muted">' + esc(cd.kind) + '</div><p class="flash-f">' + esc(cd.cue && !c.flipped ? initials(cd.front) : cd.front) + '</p>' +
      (cd.cue && !c.flipped ? '<p class="small muted">Récitez la phrase entière à partir des initiales, puis retournez la carte.</p>' : "") +

        '<div class="grade"><button class="btn ghost" data-act="grade" data-id="' + esc(id) + '" data-g="0">Oublié</button><button class="btn ghost" data-act="grade" data-id="' + esc(id) + '" data-g="1">Hésité</button><button class="btn" data-act="grade" data-id="' + esc(id) + '" data-g="2">Su</button></div>'
        : '<button class="btn ghost wide" data-act="flip">' + (cd.cue ? "Retourner la carte" : "Je pense savoir : voir la définition") + '</button>') + '</div>';
  }
  h += '</section>';
  // Le dire
  const D = info.dire;
  h += '<section class="card quote"><div class="eyebrow">Le dire du jour · à mémoriser</div><blockquote>' + esc(r.hide ? initials(D[0]) : D[0]) + '</blockquote><div class="small muted">' + esc(D[1]) + '</div><p>' + esc(D[2]) + '</p>' +
    '<div class="row-wrap">' + speakBtn(D[0]) + '<button class="chip sm' + (r.hide ? " on" : "") + '" data-act="flag" data-k="grenier.hide">Masquer : initiales seules</button>' +
    '<button class="chip sm' + (r.dire >= 3 ? " on" : "") + '" data-act="dire-rep">Récité ' + r.dire + ' / 3</button></div></section>';
  // Ma phrase

    '<label class="lbl" for="g-phr">Votre phrase, politique ou professionnelle</label><textarea id="g-phr" class="inp" rows="2" data-bind="grenier.phrase" placeholder="Employez « ' + esc(pw.m) + ' » dans une phrase sur le fil rouge : ' + esc(filOf(c)) + '">' + esc(r.phrase || "") + '</textarea>' +
    (coachOn() ? '<button class="btn ghost" data-act="sent-check">Faire vérifier par le coach</button>' : '<p class="small muted">Modèle : ' + esc(pw.ex) + '</p>') +
    '<div id="sent-out">' + (r.sentAi ? sentCard(r.sentAi) : "") + '</div></section>';

function live(step, val) { const c = ctx(); c.live = c.live || {}; c.live[step] = val; const r = R(step); return r.fz || val; }

      speechBox("atelier", { kind: "discours structuré : " + ST.t, consigne: "Sujet : " + v.sj + ". Structure imposée : " + ST.champs.join(", ") + ". Notes de préparation de l’apprenant : " + ST.champs.map((f, i) => f + " = " + (r.f[i] || "(vide)")).join(" ; "), comps: ["structure", "impro", "style"], target: 90 });

// Analyse d'un enregistrement choisi ou filmé
async function runMedia(id, file) {
  const r = R(id); freeze(id);
  const m = Media.set(id, file);
  r.media = { kind: m.kind, status: "analyse", at: Date.now() };
  refreshStudio(id);
  const prog = t => { const el = $("#mp-" + id); if (el) el.textContent = t; };
  try { prog("Analyse de la voix…"); const pcm = await decodeToMono(file); r.media.audio = analyzePCM(pcm, 8000); }
  catch (e) { r.media.audioErr = true; }
  if (m.kind === "video") {
    try {
      const v = await analyzeVideo(m.url, Math.max(1, Math.min(6, S.imgMax || 6)), p => prog("Analyse de la gestuelle… " + Math.round(p * 100) + " %"));
      if (Media.get(id) === m) m.frames = v.frames;
      r.media.motion = v.motion; r.media.dur = v.dur;
    } catch (e) { r.media.videoErr = true; }
  }
  if (!r.media.dur && r.media.audio && !r.media.audio.silent) r.media.dur = r.media.audio.dur;
  if (r.media.dur) r.sec = Math.round(r.media.dur);
  r.media.status = "ok"; saveSess();
  if (S.route === "seance" || S.route === "lib") { refreshStudio(id); const t = $('[data-tick="chrono-' + id + '"]'); if (t) t.textContent = fmtSec(r.sec); const mb = $("#m-" + id); if (mb) mb.innerHTML = metricsBlock(id); const tb = $("#tb-" + id); if (tb) tb.innerHTML = timeBox(id, ctx().boxes && ctx().boxes[id]); }
}
function refreshStudio(id) { const el = $("#studio-" + id); if (el) el.outerHTML = studioHTML(id); }

function measuredHes(c) {

}

// ---------- Bilan : agrégation des scores ----------
function collectScores(c) {
  const sc = {}; const add = (k, v) => { if (v >= 1 && v <= 5) (sc[k] = sc[k] || []).push(v); };
  const r = c.res;
  if (r.souffle && r.souffle.pAi && r.souffle.pAi.note) { add("souffle", r.souffle.pAi.note); add("presence", r.souffle.pAi.note); }
  if (r.souffle) { const n = (r.souffle.posture || []).length; if (n) add("souffle", 1 + Math.round(n * 4 / 6)); if (r.souffle.breathDone) add("serenite", 4); if (r.souffle.long) add("souffle", r.souffle.long >= 30 ? 5 : r.souffle.long >= 22 ? 4 : r.souffle.long >= 15 ? 3 : 2); }
  if (r.forge && r.forge.note) add("diction", r.forge.note);
  if (r.grenier) {
    Object.values(r.grenier.rev || {}).forEach(g => add("memoire", g === 2 ? 5 : g === 1 ? 3 : 1));
    if (r.grenier.dire >= 3) add("memoire", 4);
    if (r.grenier.sentAi) add("lexique", r.grenier.sentAi.ok ? 4 : 2);
    const said = Object.keys(r.grenier.said || {}).length; if (said) add("lexique", said >= 5 ? 4 : 3);
  }
  ["atelier", "oral", "impro", "question"].forEach(k => {
    const x = r[k]; if (!x) return;
    if (x.media && x.media.audio) Object.entries(voiceScores(x.media.audio)).forEach(([cp, v]) => add(cp, v));
    const cs = concisionScore(x.sec, x.budget || (c.boxes && c.boxes[k] && c.boxes[k].target)); if (cs && !(x.ai && x.ai.scores && x.ai.scores.concision)) add("concision", cs);
    if (x.funnel && x.funnel.length >= 3) add("concision", x.funnel.filter(f => f.dur <= f.budget * 1.1).length >= 2 ? 5 : 3);
    if (x.ai) Object.entries(x.ai.scores || {}).forEach(([cp, v]) => add(cp, v));
    else if (x.self) (c.boxes && c.boxes[k] ? c.boxes[k].comps : DAYCOMPS[c.info.type]).forEach(cp => add(cp, x.self));
  });
  if (r.atelier && Array.isArray(r.atelier.g)) r.atelier.g.forEach(g => { if (g !== undefined && g !== null) { add("ecoute", g === 2 ? 5 : g === 1 ? 3 : 1); add("memoire", g === 2 ? 5 : g === 1 ? 3 : 1); } });
  if (r.impro && r.impro.text) {
    const m = speechMetrics(r.impro.text, r.impro.sec);
    if (m.wpm) add("debit", m.wpm >= 105 && m.wpm <= 155 ? 4 : m.wpm >= 90 && m.wpm <= 170 ? 3 : 2);
    if (m.words > 40) add("debit", m.fills.length === 0 ? 5 : m.fills.length <= 2 ? 4 : m.fills.length <= 5 ? 3 : 2);
  }
  if (r.feu && r.feu.self) Object.entries(r.feu.self).forEach(([k, v]) => add(k, v));
  if (r.feu && r.feu.hes !== undefined) add("impro", [4, 3, 2][r.feu.hes]);
  return sc;
}
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;

function localBilan(c, sc) {
  const p = S.profile, lv = Object.assign({}, p.levels);
  const comps = Object.keys(sc);
  comps.forEach(k => { const t = (avg(sc[k]) - 1) / 4 * 100; lv[k] = clamp(Math.round(lv[k] + clamp((t - lv[k]) * 0.3, -8, 8)), 0, 100); });
  const all = [].concat(...Object.values(sc));
  const note = all.length ? Math.round(((avg(all) - 1) / 4 * 10) * 2) / 2 : 5;
  const ranked = comps.map(k => [k, avg(sc[k])]).sort((a, b) => b[1] - a[1]);
  const forces = ranked.filter(x => x[1] >= 3.5).slice(0, 2).map(x => COMPS[x[0]] + " (" + x[1].toFixed(1).replace(".", ",") + "/5)");
  const weakC = ranked.slice().reverse().slice(0, 2).map(x => x[0]);
  const w = weakC[0] || weakest(1)[0];
  const prev = p.history.slice(-1)[0];
  return {
    levels: lv, note,
    progression: "Note du jour : " + String(note).replace(".", ",") + " / 10" + (prev && typeof prev.note === "number" ? " (séance précédente : " + String(prev.note).replace(".", ",") + ")" : "") + ". Bilan établi d’après vos mesures et votre auto-évaluation, sans le coach IA.",
    forces: forces.length ? forces : ["Régularité : la séance est accomplie."],
    faiblesses: weakC.map(k => COMPS[k]),
    focus: COMPS[w] + " : " + DRILLS[w][0].t + ". " + DRILLS[w][0].x,
    devoir: DRILLS[w][1].x,
    phrase: lastPhrase(c) || c.info.dire[0], by: "local"
  };
}
function lastPhrase(c) { for (const k of ["question", "impro", "atelier"]) { const a = c.res[k] && c.res[k].ai; if (a && a.phrase) return a.phrase; } return ""; }

function sessionSummary(c, sc) {
  const r = c.res, L = [];
  const dur = Math.round((Date.now() - c.startedAt) / 60000);
  L.push("Durée de la séance : environ " + dur + " minutes. Thème : semaine « " + c.info.W.t + " », atelier « " + DAYNAME[c.info.type] + " ».");
  if (r.souffle) L.push("Souffle : posture " + (r.souffle.posture || []).length + "/6 points installés ; respiration guidée " + (r.souffle.breathDone ? "terminée" : "non terminée") + " ; souffle long " + (r.souffle.long || 0) + " s (record " + S.profile.records.souffle + " s).");
  if (r.forge) L.push("Diction : netteté auto-évaluée " + (r.forge.note || "?") + "/5 ; virelangues travaillés aux trois vitesses : " + Object.values(r.forge.v || {}).filter(s => s.length >= 3).length + " sur " + c.info.vire.length + ".");
  if (r.grenier) { const g = Object.values(r.grenier.rev || {}); L.push("Grenier : " + g.length + " révisions (su " + g.filter(x => x === 2).length + ", hésité " + g.filter(x => x === 1).length + ", oublié " + g.filter(x => x === 0).length + ") ; dire récité " + (r.grenier.dire || 0) + "/3 ; phrase personnelle " + (r.grenier.sentAi ? (r.grenier.sentAi.ok ? "juste" : "à reprendre") : "non vérifiée") + "."); }
  if (r.souffle && r.souffle.pAi && r.souffle.pAi.note) L.push("Posture photographiée : " + r.souffle.pAi.note + "/5 ; " + r.souffle.pAi.constats.join(" ; ") + ".");
  [["atelier", "Atelier"], ["oral", "Prise de parole filmée"], ["impro", "Improvisation"], ["question", "Question piège"]].forEach(([k, l]) => {
    const x = r[k]; if (!x) return;
    const m = x.text ? speechMetrics(x.text, x.sec) : null;
    L.push(l + " : " + (m ? m.words + " mots en " + fmtSec(m.sec) + (m.wpm ? ", " + m.wpm + " mots/min" : "") + ", " + m.fills.length + " mots parasites" : "pas de transcription") +
      (x.media && x.media.audio && !x.media.audio.silent ? " ; mesures de la voix : " + voiceSummary(x.media.audio) : "") +
      (x.media && x.media.motion ? " ; indice de mouvement " + x.media.motion.index + "/100, agitation " + x.media.motion.agit + " %, stabilité de la tête " + x.media.motion.head + "/100" : "") +
      (x.ai && x.ai.corps ? " ; corps : " + [x.ai.corps.posture, x.ai.corps.gestuelle, x.ai.corps.regard].filter(Boolean).join(" ") : "") +
      (x.ai ? " ; scores du coach " + Object.entries(x.ai.scores).map(([cp, v]) => COMPS[cp] + " " + v + "/5").join(", ") + " ; verdict : " + x.ai.verdict : x.self ? " ; auto-évaluation " + x.self + "/5" : "") + ".");
  });
  if (r.atelier && r.atelier.g) L.push("Écoute : réponses jugées " + r.atelier.g.map(g => ["fausse", "partielle", "juste"][g] || "?").join(", ") + ".");
  if (r.feu) L.push("Auto-évaluation finale : " + SELF.map(([k, l]) => l + " " + ((r.feu.self || {})[k] || "?") + "/5").join(", ") + " ; hésitations : " + (["rares", "quelques-unes", "nombreuses"][r.feu.hes] || "non renseigné") + ". Journal : « " + (r.feu.j1 || "") + " » / « " + (r.feu.j2 || "") + " ».");
  L.push("Moyennes observées (1 à 5) : " + Object.entries(sc).map(([k, v]) => COMPS[k] + " " + avg(v).toFixed(1)).join(", ") + ".");
  const prev = S.profile.bilans.slice(-1)[0];
  if (prev) L.push("Bilan précédent (séance " + prev.n + ") : note " + prev.note + "/10 ; priorité fixée : " + (S.profile.focus || "aucune") + ".");
  if (c.info.d === 4) L.push("C’est la dernière séance de la semaine : situe aussi la progression sur la semaine.");
  L.push("Fil rouge de la séance : " + filOf(c) + ".");
  if (r.souffle && r.souffle.intent) L.push("Intention choisie : " + r.souffle.intent + ".");
  if (r.feu && r.feu.vic) L.push("Victoire notée par l’apprenant : « " + r.feu.vic + " ».");
  const mw = (S.profile.missions || {})[c.info.w]; L.push("Mission terrain de la semaine (« " + MISSIONS[c.info.w].t + " ») : " + (mw ? "accomplie, appréhension " + mw.pre + " puis vécu " + mw.post : "pas encore accomplie") + ".");
  if (TEMOIN.includes(c.n)) L.push("Séance de discours témoin : situe la progression par rapport au témoin précédent.");
  return { n: c.n, text: L.join("\n") };
}

async function closeSession() {
  const c = S.cur; if (c.closing) return;
  c.closing = true; render();
  const sc = collectScores(c);
  let b = null;
  if (coachOn() && Object.keys(sc).length) { try { b = await coachBilan(sessionSummary(c, sc)); } catch (e) { toast(coachErr(e)); } }
  if (!b) b = localBilan(c, sc);
  if (!b.forces.length) b.forces = localBilan(c, sc).forces;
  if (!b.faiblesses.length) b.faiblesses = localBilan(c, sc).faiblesses;
  if (!b.focus) b.focus = localBilan(c, sc).focus;
  const p = S.profile;
  p.levels = b.levels; p.strengths = b.forces; p.weaknesses = b.faiblesses; p.focus = b.focus; p.devoir = b.devoir;
  const dur = Math.round((Date.now() - c.startedAt) / 1000);
  p.history = p.history.filter(h => h.n !== c.n); p.history.push({ n: c.n, at: Date.now(), note: b.note, dur: Math.min(dur, 3 * 3600) });
  p.bilans.push({ n: c.n, at: Date.now(), note: b.note, progression: b.progression, phrase: b.phrase, by: b.by });
  if (p.bilans.length > 80) p.bilans = p.bilans.slice(-80);
  if (!p.done.includes(c.n)) p.done.push(c.n);
  const im = c.res.impro && c.res.impro.text ? speechMetrics(c.res.impro.text, c.res.impro.sec).wpm : 0;
  if (im) { p.records.wpm.push(im); p.records.wpm = p.records.wpm.slice(-30); }
  if (b.phrase && !p.phrases.some(f => f.t === b.phrase)) { p.phrases.push({ t: b.phrase, n: c.n }); srsAdd("p:" + b.phrase.slice(0, 80), "p", { m: b.phrase }); }
  const vk = ["impro", "atelier", "question", "oral"].find(k => c.res[k] && c.res[k].media && c.res[k].media.audio && !c.res[k].media.audio.silent);
  if (vk) {
    const md = c.res[vk].media, A = md.audio, ai = c.res[vk].ai;
    p.records.voice = (p.records.voice || []).filter(v => v.n !== c.n);
    p.records.voice.push({ n: c.n, at: Date.now(), range: A.pitched >= 15 ? A.range : null, ppm: A.ppm, longP: A.longP, sps: A.sps, dyn: A.dyn, hpm: A.hpm, motion: md.motion ? md.motion.index : null, head: md.motion ? md.motion.head : null, presence: ai && ai.scores && ai.scores.presence || null });
    p.records.voice = p.records.voice.slice(-80);
  }
  const fr = c.res.feu || {};
  if (fr.vic && fr.vic.trim()) { p.victoires = (p.victoires || []).filter(v => v.n !== c.n); p.victoires.push({ t: fr.vic.trim(), n: c.n, at: Date.now() }); p.victoires = p.victoires.slice(-120); }
  const ip = c.res.impro || {};
  const hh = p.history.find(h => h.n === c.n); if (hh) hh.imp = Math.round(ip.sec || 0);
  if (TEMOIN.includes(c.n) && (ip.media || ip.ai || (ip.text || "").length > 40)) {
    p.temoins = p.temoins || {};
    const A = ip.media && ip.media.audio && !ip.media.audio.silent ? Object.assign({}, ip.media.audio) : null; if (A) delete A.tl;
    p.temoins[c.n] = { at: Date.now(), audio: A, motion: ip.media && ip.media.motion ? { index: ip.media.motion.index, head: ip.media.motion.head, agit: ip.media.motion.agit } : null, scores: ip.ai ? ip.ai.scores : null, verdict: ip.ai ? ip.ai.verdict : "", words: speechMetrics(ip.text || "", ip.sec).words };
  }
  const tk = ["impro", "atelier", "question", "oral"].find(k => c.res[k] && c.res[k].sec >= 8);
  if (tk) { const x = c.res[tk], bd = x.budget || (c.boxes && c.boxes[tk] && c.boxes[tk].target) || 120; p.records.time = (p.records.time || []).filter(v => v.n !== c.n); p.records.time.push({ n: c.n, budget: bd, dur: Math.round(x.sec), at: Date.now() }); p.records.time = p.records.time.slice(-80); }
  commitGrenier(c); Media.clearAll();
  Object.values(c.res).forEach(x => { if (x && x.media && x.media.status === "analyse") x.media.status = "ok"; });
  c.bilan = b; c.status = "terminee"; c.finishedAt = Date.now(); c.closing = false;
  saveSess(true); saveProfile(); render();
}

function commitGrenier(c) {
  if (!c || !c.info || !c.res.grenier) return;
  todayWords(c, c.info).forEach(w => srsAdd(w.id, w.id[0], w.id.startsWith("b:") ? { m: w.m, def: w.def, ex: w.ex } : null));
  if (c.res.grenier && (c.res.grenier.dire || 0) > 0) srsAdd(c.info.direId, "s");
}

// ---------- Respiration guidée ----------
const Breath = {
  tm: null, running: false, end: 0,
  start(B) {
    this.stop(); this.running = true;
    const ph = [["Inspirez", B.p[0], "in"], ["Retenez", B.p[1], "hold"], ["Expirez", B.p[2], "out"], ["Restez vide", B.p[3], "hold"]].filter(x => x[1] > 0);
    let i = 0, cyc = 0;
    const step = () => {
      if (!this.running) return;
      if (i >= ph.length) { i = 0; cyc++; if (cyc >= B.cycles) return this.finish(); }
      const [lab, sec, cls] = ph[i++]; const el = $("#breath-c");
      this.end = Date.now() + sec * 1000; this.label = lab; this.left = B.cycles - cyc;
      if (el) { el.style.setProperty("--dur", sec + "s"); el.className = "breath-c " + cls; }
      const l = $("#breath-l"); if (l) l.textContent = lab;
      this.tm = setTimeout(step, sec * 1000);
    };
    step();
  },
  stop() { clearTimeout(this.tm); this.running = false; const el = $("#breath-c"); if (el) el.className = "breath-c"; },
  finish() {
    this.stop(); if (S.cur) { R("souffle").breathDone = true; saveSess(); }
    const l = $("#breath-l"); if (l) l.textContent = "Bien";
    const b = $("#breath-btn"); if (b) b.textContent = "Recommencer";
    const s = $("#breath-s"); if (s) s.textContent = "Gardez ce calme pour parler";
  }
};

// ===== v3 : fil rouge, for intérieur, terrain, échéances, témoin, sprint, méthode =====
const UA = navigator.userAgent || "";
const IS_MOBILE = /Android|iPhone|iPad|Mobile/i.test(UA);
const IS_WIN = /Windows/i.test(UA);
const nameOf = () => S.profile.name || "Fidèle";
const personal = s => String(s).replace(/Fidèle/g, nameOf());
const dayDiff = iso => { const d = new Date(iso + "T12:00:00"); return Math.round((d - new Date(new Date().toDateString() + " 12:00:00")) / 86400000); };
const fmtDate = iso => { try { return new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long" }); } catch (e) { return iso; } };
const saveEvents = () => Store.set("events", S.events);
function upcomingEvent(maxDays = 10) {
  return (S.events.list || []).filter(e => e.date && dayDiff(e.date) >= 0 && dayDiff(e.date) <= maxDays).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}
const weekNow = () => Math.floor((nextSession() - 1) / 5);

// ---------- Fil rouge de la séance ----------
function filOf(c) {
  const meta = c.res.meta || {};
  if (meta.fil) return meta.fil;
  const ev = upcomingEvent();
  if (ev) return "Votre échéance : " + ev.titre + (ev.kfd && ev.kfd.do ? " (objectif : " + ev.kfd.do + ")" : "");
  return (c.plan && c.plan.filRouge) || c.info.sujet;
}
function fixFil(c) { const meta = (c.res.meta = c.res.meta || {}); if (!meta.fil) meta.fil = filOf(c); }

// ---------- La séance : actes, fil rouge, passerelles ----------
function viewSession() {
  const c = S.cur, info = c.info, st = STEPS[c.step];
  const mv = movementOf(info.w);
  let h = '<header class="sess-top"><button class="icon-btn" data-act="quit" aria-label="Quitter et garder ma progression">' + ICON.close + '</button>' +
    '<div class="sess-title"><b>Séance ' + pad2(c.n) + ' · ' + esc(stepTitle(st, info)) + '</b><span>' + esc(ACTS[st.k]) + ' · ' + st.min + ' min</span></div>' +
    '<div class="tick" data-tick="step">0:00</div></header>' +
    '<div class="prog7" aria-label="Étape ' + (c.step + 1) + ' sur 7">' + STEPS.map((s, i) => '<button data-act="goto" data-i="' + i + '" class="' + (i < c.step ? "past" : i === c.step ? "now" : "") + '" aria-label="' + esc(stepTitle(s, info)) + '"></button>').join("") + '</div>';
  h += '<div class="filrouge"><span>Fil rouge du jour</span><b>' + esc(filOf(c)) + '</b><small>Mouvement « ' + esc(mv.t) + ' » · semaine ' + (info.w + 1) + ' « ' + esc(info.W.t) + ' »</small></div>';
  h += planBar();
  h += '<div class="step">' + ({ souffle: stepSouffle, forge: stepForge, grenier: stepGrenier, atelier: stepAtelier, impro: stepImpro, question: stepQuestion, feu: stepFeu })[st.k](c, info) + '</div>';
  if (st.k !== "feu") {
    const br = bridge(st.k, info);
    h += (br ? '<div class="passerelle">' + esc(br) + '</div>' : "") +
      '<nav class="step-nav">' + (c.step > 0 ? '<button class="btn ghost" data-act="prev">Précédent</button>' : '<span></span>') + '<button class="btn" data-act="next">' + esc(NEXT_LABEL[st.k] || "Étape suivante") + '</button></nav>';
  }
  return h;
}

// Le for intérieur, en ouverture du Souffle
function innerCard(c, info) {
  const L = LAB[info.w], r = R("souffle");
  let h = '<section class="card inner"><div class="eyebrow">Le laboratoire intérieur · semaine ' + (info.w + 1) + '</div><h2>' + esc(L.t) + '</h2>';
  if (info.d === 0 || r.labOpen) h += '<p>' + esc(personal(L.sci)) + '</p><p><b>À pratiquer :</b> ' + esc(personal(L.pr)) + '</p>';
  else h += '<p class="small muted">Rappel de la leçon de la semaine. <button class="link" data-act="flag" data-k="souffle.labOpen">Relire la leçon</button></p><p><b>À pratiquer :</b> ' + esc(personal(L.pr)) + '</p>';
  h += '<p class="formule">« ' + esc(personal(L.f)) + ' »</p>' + speakBtn(personal(L.f), "Écouter la formule");
  h += '<div class="intent"><span>Mon intention pour cette séance</span><div class="chips">' + INTENTIONS.map(t => '<button class="chip sm' + (r.intent === t ? " on" : "") + '" data-act="intent" data-v="' + esc(t) + '">' + esc(t) + '</button>').join("") + '</div>' +
    (r.intent ? '<p class="small">Dites-le à voix basse : « ' + esc(nameOf()) + ', aujourd’hui, ' + esc(r.intent.toLowerCase()) + '. »</p>' : "") + '</div></section>';
  return h;
}

// ---------- L'improvisation : du fragment au discours entier ----------
function stepImpro(c, info) {
  if (TEMOIN.includes(c.n)) return stepTemoin(c, info);
  const mode = IMPRO_MODE[info.type], P = c.plan || {}, r = R("impro"); r.sc = r.sc || {};
  const v = live("impro", { sj: filOf(c), an: (P.impro && P.impro.angle) || "" });
  const ch = CHARPENTES.find(x => x.id === r.ch) || charpenteOf(c.n);
  const salle = info.type === "arene" ? ((P.salle && P.salle.length ? P.salle : SALLE)) : null;
  let h = '<section class="card"><div class="eyebrow">' + esc(mode.t) + '</div><h2>' + esc(v.sj) + '</h2><p>' + esc(mode.x) + '</p>' + (v.an ? '<p class="muted small">Angle du coach : ' + esc(v.an) + '</p>' : "") +
    (salle ? '<ol class="method">' + salle.map(q => '<li>« ' + esc(q) + ' »</li>').join("") + '</ol>' : "") +
    '<div class="defi"><span>Défi du jour</span><b>' + esc(info.defi) + '</b></div></section>';
  h += '<section class="card"><div class="eyebrow">Votre charpente · ' + esc(ch.src) + '</div><h3>' + esc(ch.t) + '</h3>' +
    '<p class="small muted">Trente secondes : un ou deux mots par case, pas de phrases. Puis parlez sans regarder.</p>' +
    ch.f.map((f, i) => '<label class="lbl" for="ch' + i + '">' + esc(f) + '</label><input id="ch' + i + '" class="inp" data-bind="impro.sc.' + i + '" value="' + esc(r.sc[i] || "") + '">').join("") +
    '<div class="row-wrap"><button class="btn ghost sm" data-act="prep">' + (c.prepT0 ? '<span data-tick="prep">30</span>' : "Lancer les 30 secondes") + '</button></div>' +
    '<details class="redo"><summary>Changer de charpente</summary><div class="chips">' + CHARPENTES.map(x => '<button class="chip sm' + (x.id === ch.id ? " on" : "") + '" data-act="charpente" data-v="' + x.id + '">' + esc(x.t) + '</button>').join("") + '</div></details>' +
    (info.w < 2 ? '<p class="small"><b>Osez la simplicité.</b> Une idée claire et posée vaut mieux que trois idées brillantes et confuses. Remplacez chaque « euh » par un silence.</p>' : "") + '</section>';
  h += speechBox("impro", { kind: "improvisation (" + mode.t + ")", consigne: mode.x + " Sujet : « " + v.sj + " »." + (salle ? " Questions de la salle : " + salle.join(" / ") : "") + " Charpente imposée : " + ch.t + " (" + ch.f.join(", ") + "). Notes de préparation : " + ch.f.map((f, i) => (r.sc[i] || "(vide)")).join(" ; ") + ". Défi imposé : " + info.defi + ".", comps: ["impro", "structure", "debit", "lexique"], target: info.type === "arene" ? 90 : 120 });
  return h;
}
function lastTemoin(before) { const t = S.profile.temoins || {}; const ks = Object.keys(t).map(Number).filter(n => n < before).sort((a, b) => a - b); return ks.length ? Object.assign({ n: ks[ks.length - 1] }, t[ks[ks.length - 1]]) : null; }
function temoinLine(t) {
  if (!t) return "";
  const a = t.audio || {};
  return "séance " + t.n + " : " + (a.dur ? "durée " + fmtSec(a.dur) + ", intonation " + a.range + " demi-tons, " + a.ppm + " pauses par minute, " + a.longP + " silences d’orateur, " + a.sps + " syllabes par seconde, " + a.hpm + " hésitations par minute" : "pas de mesure vocale") + (t.motion ? ", mouvement " + t.motion.index + "/100" : "") + (t.scores ? ", scores " + Object.entries(t.scores).map(([k, v]) => COMPS[k] + " " + v + "/5").join(", ") : "") + (t.verdict ? ". Verdict : " + t.verdict : "");
}
function stepTemoin(c, info) {
  const prev = lastTemoin(c.n);
  let h = '<section class="card temoin"><div class="eyebrow">Le discours témoin · séance ' + c.n + '</div><h2>La preuve de votre transformation</h2>' +
    '<p>Aux séances 1, 10, 20, 40 et 60, vous prononcez le même discours, filmé. Rien ne mesure mieux le chemin parcouru que de vous voir, à quelques semaines d’écart, répondre à la même question.</p>' +
    '<p class="qtext">« ' + esc(TEMOIN_SUJET) + ' »</p>' +
    (prev ? '<p class="small muted">Votre dernier témoin (séance ' + prev.n + ') sera comparé à celui-ci par le coach.</p>' : '<p class="small muted">C’est votre point de départ : ne cherchez pas la perfection, cherchez la sincérité.</p>') + '</section>';
  h += speechBox("impro", { kind: "discours témoin", consigne: TEMOIN_SUJET + (prev ? " Discours témoin précédent, " + temoinLine(prev) + ". Compare explicitement : ce qui a progressé, ce qui stagne, et la priorité pour le prochain témoin." : " C’est le premier témoin : établis un point de départ précis et bienveillant."), comps: ["impro", "structure", "debit", "relation"], target: 120 });
  return h;
}

// ---------- Le feu du soir : bilan, victoire, mission ----------
function stepFeu(c, info) {
  const r = R("feu"); r.self = r.self || {};
  if (c.bilan) return bilanView(c, info);
  const M = MISSIONS[info.w], md = (S.profile.missions || {})[info.w];
  return '<section class="card"><div class="eyebrow">Autour du feu · votre regard sur la séance</div><ul class="diag-list">' +
    SELF.map(([k, l]) => '<li><span>' + esc(l) + '</span>' + seg("feu", "self." + k, r.self[k]) + '</li>').join("") + '</ul>' +
    measuredHes(c) +
    '<div class="self"><span>Hésitations perçues</span><div class="seg s3">' + ["Rares", "Quelques-unes", "Nombreuses"].map((l, i) => '<button class="' + (r.hes === i ? "on" : "") + '" data-act="sseg" data-s="feu" data-k="hes" data-v="' + i + '">' + l + '</button>').join("") + '</div></div>' +
    '<label class="lbl" for="f-j1">Ce que je retiens de la séance</label><textarea id="f-j1" class="inp" rows="2" data-bind="feu.j1">' + esc(r.j1 || "") + '</textarea>' +
    '<label class="lbl" for="f-j2">Ce que je ferai mieux à la prochaine</label><textarea id="f-j2" class="inp" rows="2" data-bind="feu.j2">' + esc(r.j2 || "") + '</textarea></section>' +
    '<section class="card victory"><div class="eyebrow">Le carnet des victoires</div><p class="small">La confiance se construit sur des preuves. Notez une victoire du jour, même petite : un silence tenu, une phrase réussie, un « euh » évité.</p><label class="lbl" for="f-vic">Ma victoire du jour</label><input id="f-vic" class="inp" data-bind="feu.vic" value="' + esc(r.vic || "") + '"></section>' +
    '<section class="card"><div class="eyebrow">Mission terrain de la semaine</div><h3>' + esc(M.t) + '</h3><p class="small">' + esc(M.x) + '</p>' + (md ? '<p class="pill">Accomplie</p>' : '<details class="redo"><summary>Je l’ai accomplie : noter l’expérience</summary>' + missionForm(info.w, S.mForm || {}) + '</details>') + '</section>' +
    '<nav class="step-nav"><button class="btn ghost" data-act="prev">Précédent</button><button class="btn" data-act="close" id="close-btn">' + (c.closing ? "Le coach établit votre bilan…" : "Clore la séance et recevoir mon bilan") + '</button></nav>';
}

// ---------- Accueil ----------
function viewHome() {
  const p = S.profile, n = nextSession(), info = sessionInfo(n);
  const cur = Store.readLocal(sessKey(n));
  const enCours = cur && cur.status === "en-cours";
  const allDone = p.done.length >= TOTAL;
  const wk = doneThisWeek(), due = srsDue(99).length, mv = movementOf(info.w);
  const dateStr = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const ev = upcomingEvent(14);
  const fil = ev ? "Votre échéance : " + ev.titre : info.sujet;
  let h = '<header class="top"><div class="brand">Le Verbe <em>Souverain</em></div><div class="date">' + esc(dateStr) + '</div></header>';
  if (!p.diag) h += '<section class="card diag-cta"><div class="eyebrow">Avant la première séance</div><h2>Votre diagnostic de départ</h2><p>Trois minutes pour situer vos quinze compétences. Le parcours s’adaptera dès la première séance.</p><button class="btn" data-act="go" data-r="diag">Faire mon diagnostic</button></section>';
  const acts = [["Acte I · Accorder l’instrument", [0, 1]], ["Acte II · Forger la pensée", [2, 3]], ["Acte III · Entrer dans l’arène", [4, 5]], ["Le feu du soir", [6]]];
  h += '<section class="hero card"><div class="hero-num"><span class="big">' + pad2(n) + '</span><span class="of">/ 60</span></div>' +
    '<div class="hero-body"><div class="eyebrow">' + esc(mv.t) + ' · semaine ' + (info.w + 1) + '</div><h1>' + (allDone ? "Parcours accompli" : esc(info.W.t)) + '</h1>' +
    '<p class="muted">' + esc(info.W.but) + '</p><div class="filrouge small-fr"><span>Fil rouge</span><b>' + esc(fil) + '</b></div>' +
    '<ol class="acts">' + acts.map(([t, ix]) => '<li><b>' + esc(t) + '</b><span>' + ix.map(i => esc(stepTitle(STEPS[i], info))).join(" · ") + '</span><em>' + ix.reduce((a, i) => a + STEPS[i].min, 0) + ' min</em></li>').join("") + '</ol>' +
    '<p class="small muted">L’acte III se filme : prévoyez un endroit calme et lumineux.' + (TEMOIN.includes(n) ? ' <b>Aujourd’hui : discours témoin.</b>' : "") + '</p>' +
    '<button class="btn wide" data-act="start" data-n="' + n + '">' + ICON.play + '<span>' + (enCours ? "Reprendre la séance" : allDone ? "Revoir la dernière séance" : "Commencer la séance") + '</span></button></div></section>';
  if (ev) {
    const dd = dayDiff(ev.date);
    h += '<section class="card event-cta"><div class="row-between"><div><div class="eyebrow">Échéance · ' + esc(ev.type) + '</div><h3>' + esc(ev.titre) + '</h3><p class="small muted">' + esc(fmtDate(ev.date)) + '</p></div><div class="countdown"><b>' + (dd === 0 ? "Jour J" : "J-" + dd) + '</b></div></div>' +
      '<div class="btn-row">' + (ev.plan ? '<button class="btn sm" data-act="rehearse" data-id="' + ev.id + '">Répéter au Studio</button>' : '<button class="btn sm" data-act="go" data-r="terrain">Préparer avec le coach</button>') + '</div></section>';
  }
  h += sprintCard();
  const lastB = p.bilans[p.bilans.length - 1];
  if (lastB) h += '<section class="card coachnote"><div class="eyebrow">Le mot du coach · après la séance ' + lastB.n + '</div>' + (p.focus ? '<p class="lead">' + esc(p.focus) + '</p>' : "") + (p.devoir ? '<p><b>Devoir :</b> ' + esc(p.devoir) + '</p>' : "") + '</section>';
  const vics = p.victoires || [];
  if (vics.length) { const v = vics[(new Date().getDate()) % vics.length]; h += '<section class="card victory"><div class="eyebrow">Souvenez-vous · séance ' + v.n + '</div><p class="lead">« ' + esc(v.t) + ' »</p><p class="small muted">' + vics.length + ' victoire' + (vics.length > 1 ? "s" : "") + ' au carnet. Chacune est une preuve que vous en êtes capable.</p></section>'; }
  h += '<section class="grid2"><button class="card tile" data-act="go" data-r="lib" data-tab="grenier"><div class="eyebrow">Le Grenier</div><div class="tile-num">' + due + '</div><div class="muted small">' + (due > 1 ? "grains à revoir" : "grain à revoir") + '</div></button>' +
    '<button class="card tile" data-act="go" data-r="prog"><div class="eyebrow">Régularité</div><div class="cowries">' + [0, 1, 2, 3, 4].map(i => cowrie(i < wk)).join("") + '</div><div class="muted small">' + wk + ' / 5 cette semaine · ' + p.done.length + ' / 60</div></button></section>';
  h += '<section class="card quote"><div class="eyebrow">Le dire de la séance</div><blockquote>' + esc(info.dire[0]) + '</blockquote><div class="muted small">' + esc(info.dire[1]) + '</div>' + speakBtn(info.dire[0]) + '</section>';
  return h;
}

// Le sprint des quatorze jours : la preuve d'un changement dès la deuxième semaine
function sprintItems() {
  const p = S.profile, V = p.records.voice || [], sh = p.records.souffleHist || [], M = p.missions || {}, T = p.temoins || {};
  const first = V[0], last = V[V.length - 1];
  const impN = p.history.filter(h => (h.imp || 0) >= 90).length;
  return [
    { t: "Souffle long : gagner cinq secondes", ok: sh.length > 1 && Math.max(...sh) - sh[0] >= 5, v: sh.length ? sh[0] + " s → " + Math.max(...sh) + " s" : "à mesurer" },
    { t: "Hésitations sonores divisées par deux", ok: V.length > 1 && first.hpm > 0 ? last.hpm <= first.hpm / 2 : V.length > 1 && last.hpm === 0, v: V.length > 1 ? String(first.hpm).replace(".", ",") + " → " + String(last.hpm).replace(".", ",") + " par min" : "deux enregistrements nécessaires" },
    { t: "Au moins un silence d’orateur par prise", ok: !!last && last.longP >= 1, v: last ? last.longP + " à la dernière prise" : "à mesurer" },
    { t: "Trois improvisations de deux minutes ou plus", ok: impN >= 3, v: impN + " / 3" },
    { t: "Tenir le temps imparti à trois prises", ok: (p.records.time || []).filter(x => x.dur <= x.budget * 1.1 && x.dur >= x.budget * 0.6).length >= 3, v: (p.records.time || []).filter(x => x.dur <= x.budget * 1.1 && x.dur >= x.budget * 0.6).length + " / 3" },
    { t: "Deux missions terrain accomplies", ok: [0, 1].filter(w => M[w]).length >= 2, v: [0, 1].filter(w => M[w]).length + " / 2" },
    { t: "Discours témoin des séances 1 et 10", ok: !!(T[1] && T[10]), v: (T[1] ? "1 fait" : "1 à faire") + " · " + (T[10] ? "10 fait" : "10 à faire") }
  ];
}
function sprintCard() {
  const p = S.profile;
  if (p.done.length >= 15) return "";
  const it = sprintItems(), okN = it.filter(x => x.ok).length;
  return '<section class="card sprint"><div class="row-between"><div><div class="eyebrow">Le sprint des quatorze jours</div><h3>Un changement visible dès la deuxième semaine</h3></div><span class="pill">' + okN + ' / ' + it.length + '</span></div><ul class="sprint-list">' +
    it.map(x => '<li class="' + (x.ok ? "ok" : "") + '"><span class="ck">' + (x.ok ? ICON.check : "") + '</span><span>' + esc(x.t) + '<small>' + esc(x.v) + '</small></span></li>').join("") + '</ul></section>';
}

// ---------- Le Terrain : l'échelle du courage et les échéances ----------
function viewTerrain() {
  const p = S.profile, M = p.missions || {}, w0 = weekNow();
  let h = '<header class="top"><div class="brand">Le Terrain</div><div class="date">là où la confiance se prouve</div></header>';
  h += '<section class="card"><p>La confiance inébranlable ne naît pas d’un exercice : elle naît d’expériences réussies, de plus en plus exigeantes. Chaque semaine, une mission réelle. Avant, notez votre appréhension ; après, ce que vous avez réellement ressenti. Vous verrez semaine après semaine que la peur annonce toujours plus qu’elle ne tient.</p></section>';
  const cur = MISSIONS[w0], md = M[w0], f = S.mForm || {};
  h += '<section class="card mission"><div class="eyebrow">Mission de la semaine ' + (w0 + 1) + '</div><h2>' + esc(cur.t) + '</h2><p>' + esc(cur.x) + '</p><p class="small muted"><b>Réussie quand :</b> ' + esc(cur.ok) + '</p>';
  if (md) h += missionDone(md);
  else h += missionForm(w0, f);
  h += '</section>';
  h += '<section class="card"><div class="eyebrow">L’échelle du courage · 12 marches</div><ol class="ladder">' + MISSIONS.map((m, i) => '<li class="' + (M[i] ? "done" : i === w0 ? "now" : "") + '"><button class="link-row" data-act="mission-open" data-w="' + i + '"><span class="rung">' + (M[i] ? ICON.check : pad2(i + 1)) + '</span><span>' + esc(m.t) + (M[i] ? '<small>appréhension ' + M[i].pre + ' → vécu ' + M[i].post + '</small>' : "") + '</span></button></li>').join("") + '</ol>' +
    (S.mOpen !== undefined && S.mOpen !== w0 ? '<div class="card sub"><div class="eyebrow">Marche ' + (S.mOpen + 1) + '</div><h3>' + esc(MISSIONS[S.mOpen].t) + '</h3><p class="small">' + esc(MISSIONS[S.mOpen].x) + '</p>' + (M[S.mOpen] ? missionDone(M[S.mOpen]) : missionForm(S.mOpen, f)) + '</div>' : "") + '</section>';
  h += fearChart();
  // Échéances
  const list = (S.events.list || []).slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const up = list.filter(e => !e.date || dayDiff(e.date) >= 0), past = list.filter(e => e.date && dayDiff(e.date) < 0);
  h += '<section class="card"><div class="eyebrow">Mes échéances réelles</div><p class="small">Un entretien, une réunion, un bailleur, un discours engagé : inscrivez-le. Le coach vous prépare un angle original, une structure, trois ouvertures, les questions à redouter et un plan de répétition. Vos séances prennent alors cette échéance pour fil rouge.</p>' +
    '<details class="newev"' + (list.length ? "" : " open") + '><summary>Ajouter une échéance</summary>' + eventForm() + '</details></section>';
  up.forEach(e => { h += eventCard(e); });
  if (past.length) h += '<section class="card"><div class="eyebrow">Échéances passées</div></section>' + past.slice().reverse().map(eventCard).join("");
  return h;
}
function missionForm(w, f) {
  const k = "m" + w;
