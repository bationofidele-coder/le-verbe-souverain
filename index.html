// ===== Chrono de synthèse : dire l'essentiel dans le temps imparti =====
const BUDGETS = [[30, "30 s"], [60, "1 min"], [90, "1 min 30"], [120, "2 min"], [180, "3 min"], [300, "5 min"]];
const FUNNEL = [120, 60, 30];
const budgetOf = (id, o) => { const r = R(id); return r.budget || (o && o.target) || 120; };
function concisionScore(sec, budget) {
  if (!sec || !budget || sec < 8) return null;
  const q = sec / budget;
  if (q < 0.6) return 3; if (q <= 1.1) return 5; if (q <= 1.25) return 4; if (q <= 1.5) return 3; return 2;
}
function timeVerdict(sec, budget) {
  if (!sec || sec < 8) return null;
  const d = Math.round(sec - budget), q = sec / budget;
  if (q < 0.6) return { cls: "warn", t: "Très court : " + fmtSec(sec) + " pour " + fmtSec(budget) + ". Développez une preuve." };
  if (q <= 1.1) return { cls: "ok", t: fmtSec(sec) + " pour " + fmtSec(budget) + " : dans le temps." };
  return { cls: q <= 1.25 ? "warn" : "bad", t: fmtSec(sec) + " pour " + fmtSec(budget) + " : dépassement de " + fmtSec(d) + "." };
}
function timeBox(id, o) {

// ===== Transcription automatique sur l'appareil (Whisper base, quantifié) =====
// Les fichiers du modèle sont publiés en morceaux avec l'application, réassemblés
// puis gardés dans le cache du navigateur : un seul téléchargement.
const ASR = {
  LIB: "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js",
  PARTS: typeof ASR_PARTS !== "undefined" ? ASR_PARTS : {},
  CACHE: "vs-asr-v1",
  pipe: null, loading: null, state: "idle", progress: 0,
  base() { return new URL("asr/", location.href).href; },
  targets() {
    const b = this.base();
    return { [b + "ort-wasm-simd-threaded.jsep.wasm"]: "ort.wasm", [b + "wb/onnx/encoder_model_quantized.onnx"]: "enc.onnx", [b + "wb/onnx/decoder_model_merged_quantized.onnx"]: "dec.onnx" };
  },
  totalBytes() { return Object.values(this.PARTS).reduce((a, p) => a + p.size, 0); },
  async cacheGet(key) { try { if (!("caches" in window)) return null; const c = await caches.open(this.CACHE); const r = await c.match(key); return r ? await r.arrayBuffer() : null; } catch (e) { return null; } },
  async cachePut(key, buf, type) { try { if (!("caches" in window)) return; const c = await caches.open(this.CACHE); await c.put(key, new Response(buf, { headers: { "Content-Type": type } })); } catch (e) { } },
  async isCached() { try { if (!("caches" in window)) return false; const c = await caches.open(this.CACHE); const ks = Object.keys(this.targets()); for (const k of ks) if (!(await c.match(k))) return false; return true; } catch (e) { return false; } },
  patchFetch() {
    if (this._patched) return; this._patched = true;
    const orig = window.fetch.bind(window), T = this.targets(), self = this;
    window.fetch = async function (input, init) {
      const url = new URL(typeof input === "string" ? input : input.url, location.href).href;
      const name = T[url];
      if (!name) return orig(input, init);
      const type = name.endsWith("wasm") ? "application/wasm" : "application/octet-stream";
      let buf = await self.cacheGet(url);
      if (!buf) {
        const P = self.PARTS[name], chunks = [];
        for (const p of P.parts) {
          const r = await orig(new URL(p, location.href).href); if (!r.ok) throw new Error("part " + p);
          const b = new Uint8Array(await r.arrayBuffer()); chunks.push(b); self.loaded = (self.loaded || 0) + b.byteLength; self.onProg && self.onProg();
        }
        const out = new Uint8Array(P.size); let o = 0; chunks.forEach(c => { out.set(c, o); o += c.byteLength; });

      return new Response(buf, { status: 200, headers: { "Content-Type": type, "Content-Length": String(buf.byteLength) } });
    };
  },
  load(onProg) {
    if (this.pipe) return Promise.resolve(this.pipe);
    if (this.loading) return this.loading;
    this.onProg = () => { this.progress = Math.min(1, (this.loaded || 0) / this.totalBytes()); onProg && onProg(this.progress); };
    this.state = "loading"; this.loaded = 0;
    this.loading = (async () => {
      this.patchFetch();
      const T = await import(this.LIB);
      T.env.allowRemoteModels = false; T.env.allowLocalModels = true;
      T.env.localModelPath = this.base(); T.env.useBrowserCache = false;
      T.env.backends.onnx.wasm.wasmPaths = this.base();
      T.env.backends.onnx.wasm.numThreads = 1; T.env.backends.onnx.wasm.proxy = false;
      this.pipe = await T.pipeline("automatic-speech-recognition", "wb", { dtype: "q8", device: "wasm" });
      this.state = "ready"; return this.pipe;
    })().catch(e => { this.state = "error"; this.err = String(e && e.message || e); this.loading = null; throw e; });
    return this.loading;
  },
  async transcribe(pcm16k, onStage) {
    const p = await this.load();
    onStage && onStage("Transcription de votre parole…");
    const out = await p(pcm16k, { language: "french", task: "transcribe", chunk_length_s: 30, stride_length_s: 5, return_timestamps: false });
    return String((out && out.text) || "").replace(/\s+/g, " ").trim();
  }
};

  const sc = (r, k) => r.ai && r.ai.scores && r.ai.scores[k] || null;
  return '<div class="cmp"><div class="eyebrow">Première prise → deuxième prise</div><table><tbody>' +

    row("Silences d’orateur", A ? A.longP : null, B ? B.longP : null, "high") +
    row("Intonation (demi-tons)", A && A.pitched >= 15 ? A.range : null, B && B.pitched >= 15 ? B.range : null, "high") +
    row("Improvisation (coach)", sc(a, "impro"), sc(b, "impro"), "high") +
    row("Structure (coach)", sc(a, "structure"), sc(b, "structure"), "high") +
    '</tbody></table></div>';
}

const _runMedia = runMedia;

  await _runMedia(id, file);

  on: false, segs: [], i: 0, t0: 0, tm: null, key: null, done: null, wake: null, lastPulse: 0,
  start(key, segs, done) {
    this.stop(true); Voice.stop(); Music.stop(true);
    Object.assign(this, { on: true, segs, i: 0, key, done, t0: Date.now(), lastPulse: 0 });
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { this.wake = w; }).catch(() => { }); } catch (e) { }
    let el = $("#run"); if (!el) { el = document.createElement("div"); el.id = "run"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); document.body.appendChild(el); }
    el.hidden = false; this.enter(); clearInterval(this.tm); this.tm = setInterval(() => this.tick(), 150);
  },
  enter() {
    const s = this.segs[this.i]; this.t0 = Date.now(); this.lastPulse = 0;
    beep(s.kind === "dire" ? 1 : 1, s.kind === "dire" ? 880 : 587);
    if (s.aud && VOICE_ON()) Voice.play(s.aud);
    this.draw();
  },
  draw() {
    const el = $("#run"), s = this.segs[this.i]; if (!el || !s) return;
    el.className = s.kind;
    el.innerHTML = '<div class="run-in"><div class="run-top">' + esc(s.kind === "prep" ? "Préparez" : s.kind === "souffle" ? "Respirez" : "Parlez") + ' · ' + (this.i + 1) + ' / ' + this.segs.length + '</div>' +
      '<div class="run-t" id="run-t">' + Math.ceil(s.sec) + '</div><p class="run-lab">' + esc(s.lab) + '</p>' + (s.txt ? '<p class="run-txt">' + esc(s.txt) + '</p>' : "") +
      '<div class="run-btns"><button class="btn" data-act="run-next">' + (this.i < this.segs.length - 1 ? "Étape suivante" : "Terminer") + '</button><button class="btn ghost" data-act="run-stop">Arrêter</button></div></div>';
  },
  tick() {
    if (!this.on) return; const s = this.segs[this.i]; const el = (Date.now() - this.t0) / 1000, left = s.sec - el;
    const t = $("#run-t"); if (t) t.textContent = Math.max(0, Math.ceil(left));
    if (s.pulse && Math.floor(el / s.pulse) > this.lastPulse) { this.lastPulse = Math.floor(el / s.pulse); beep(1, 660); }
    if (s.kind === "souffle") { const ph = Math.floor(el) % 10 < 4 ? "Inspirez" : "Expirez"; const lb = $("#run .run-lab"); if (lb && lb.textContent !== ph) lb.textContent = ph; }
    if (left <= 0) this.next();
  },
  next() { if (!this.on) return; if (this.i < this.segs.length - 1) { this.i++; this.enter(); } else this.finish(); },
  finish() { const d = this.done, k = this.key; this.stop(false); if (d) d(k); },
  stop(silent) {
    clearInterval(this.tm); const was = this.on; this.on = false;
    try { if (this.wake) this.wake.release(); } catch (e) { } this.wake = null;
    const el = $("#run"); if (el) { el.hidden = true; el.innerHTML = ""; }
    if (was && !silent) beep(2, 1046);
  }
};
// Déploie la description d'un exercice en étapes concrètes
function drillSegs(c, id) {
  const D = DRILLS7[id], P = c.info.pack, L = v7().lad, sujet = P.fil;
  const mots = knownWords7(3).join(", ");
  const sub = s => s.replace("{SUJET}", sujet).replace("{MOTS}", mots || P.words.map(w => w[0]).join(", "));
  if (typeof D.seg === "string") {
    const [kind, k, prep, speak] = [D.seg[0], Number(D.seg.slice(1).split(":")[0]), Number(D.seg.split(":")[1]), Number(D.seg.split(":")[2])];
    const out = [];
    if (kind === "Q") pickN(QBANK[L.q], k, c.n, id.length).forEach((qi, j) => { const q = QBANK[L.q][qi]; out.push({ lab: q[1], sec: prep, kind: "prep", txt: q[0], aud: "q" + L.q + "-" + qi }); out.push({ lab: id === "objections" ? "Certes… Cependant… C’est pourquoi…" : "Répondez", sec: speak, kind: "dire", txt: q[1] }); });
    if (kind === "N") pickN(POSITIONS, k, c.n, 3).forEach(pi => { out.push({ lab: POSITIONS[pi], sec: prep, kind: "prep", txt: "Quel intérêt protège-t-on ?" }); out.push({ lab: "Votre question ouverte", sec: speak, kind: "dire", txt: POSITIONS[pi] }); });
    return out;
  }
  return D.seg.map(([lab, sec, kind, pulse]) => ({ lab: sub(lab), sec, kind, pulse: pulse || 0, txt: D.phrase && kind === "dire" ? D.phrase : "" }));
}
function knownWords7(k) {
  const ws = Object.keys(S.srs.items).filter(id => id.startsWith("w:")).map(id => id.slice(2));
  const P = S.cur && S.cur.info && S.cur.info.pack; const pool = ws.length >= k ? ws : ws.concat(P ? P.words.map(w => w[0]) : []);
  return pickN(pool, Math.min(k, pool.length), S.cur ? S.cur.n : 1, 11).map(i => pool[i]);
}

function capVerdict(r, K) {
  const tp = K.q.filter(([, ok], i) => ok && r.sel.includes(i)).length, fp = K.q.filter(([, ok], i) => !ok && r.sel.includes(i)).length;

}
function capScore(r, K) {
  const tp = K.q.filter(([, ok], i) => ok && r.sel.includes(i)).length, fp = K.q.filter(([, ok], i) => !ok && r.sel.includes(i)).length;
  let s = tp === 3 && !fp ? 5 : (tp === 3 && fp === 1) || (tp === 2 && !fp) ? 4 : tp >= 2 ? 3 : tp === 1 ? 2 : 1; if (r.replays) s = Math.max(1, s - 1); return s;
}

// ---------- Construction des étapes de la Forge ----------
function forgeSegs(ids) {
  const out = [];
  ids.forEach((i, k) => {
    const t = VIRE10[i], s = Math.max(4, syllEst(t));
    out.push({ kind: "ecoute", lab: t, txt: "Phrase " + (k + 1) + " sur " + ids.length, aud: "x" + i, waitAud: true, sec: 10 });
    out.push({ kind: "dire", lab: t, txt: "1 · Lentement", sec: Math.round(s / 2.6 + 1.6), tag: i });
    out.push({ kind: "dire", lab: t, txt: "2 · Normalement", sec: Math.round(s / 3.8 + 1.4), tag: i });
    out.push({ kind: "dire", lab: t, txt: "3 · Vite et net", sec: Math.round(s / 5 + 1.3), tag: i });
  });
  return out;
}
async function evalForge(ids, res) {
  const r = R("forge"); if (!res.file) { r.noEval = true; r.acc = null; saveSess(); render(); return; }
  S.evalBusy = "forge"; S.evalMsg = "J’écoute votre Forge…"; render();
  try {
    const H = await hear(res.file, res.wins.map(w => [w[0], w[1]]), t => { S.evalMsg = t; const el = $(".analysing"); if (el) el.lastChild.textContent = t; });
    const ref = [], tag = []; ids.forEach(i => { for (let k = 0; k < 3; k++) toks(VIRE10[i]).forEach(w => { ref.push(w); tag.push(i); }); });
    const ok = alignRef(ref, toks(H.text));
    const per = {}; ids.forEach(i => per[i] = [0, 0]); ok.forEach((v, j) => { per[tag[j]][1]++; if (v) per[tag[j]][0]++; });
    r.acc = ok.filter(Boolean).length / Math.max(1, ok.length);
    r.per = Object.fromEntries(ids.map(i => [i, per[i][1] ? per[i][0] / per[i][1] : 0]));
    r.weak = ids.filter(i => r.per[i] < 0.8).sort((a, b) => r.per[a] - r.per[b]).slice(0, 3);
    const miss = {}; ok.forEach((v, j) => { if (!v && ref[j].length > 2) miss[ref[j]] = (miss[ref[j]] || 0) + 1; });
    r.miss = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => x[0]);
    r.note = (H.m && !H.m.silent ? "Débit " + comma(H.m.sps) + " syllabes par seconde sur la version rapide et lente confondues. " : "") + "Mesure par reconnaissance vocale : un mot mal articulé est souvent mal reconnu.";
    r.text = H.text; r.noEval = false;
  } catch (e) { r.noEval = true; toast("Je n’ai pas pu analyser la Forge sur cet appareil."); }
  S.evalBusy = null; saveSess(); render();
}

    case "close": await closeSession(); break;
    case "aud": { const id = b.dataset.aud; if (Voice.cur && Voice.cur.id === id) { Voice.stop(); break; } if (!Voice.play(id, Number(b.dataset.rate) || 1)) toast("Audio indisponible pour cette consigne."); break; }
    case "cnext": { const cards = buildCards(c); if (c.card >= cards.length - 1) break; cardGo(c.card + 1); break; }
    case "cprev": cardGo((c.card || 0) - 1, false); break;
    case "voice-toggle": { try { localStorage.setItem("vs1:voice", VOICE_ON() ? "0" : "1"); } catch (e) { } if (!VOICE_ON()) Voice.stop(); render(); toast(VOICE_ON() ? "Voix automatique activée." : "Voix automatique coupée : touchez Écouter quand vous voulez."); break; }
    case "copy-link": { try { await navigator.clipboard.writeText(APP_URL); toast("Lien copié. Collez-le dans Chrome."); } catch (e) { toast(APP_URL); } break; }
    case "wv-hide": S.wvHide = true; render(); break;
    case "pick": watchPick(b.dataset.id); break;
    case "po-guide": {
      Voice.seq(["ui:posture", "po:0", "po:1", "po:2", "po:3", "po:4", "po:5"], i => { c.poIdx = i - 1; const il = $(".cardx .cx-ill"); if (il) il.innerHTML = ILL.posture(c.poIdx); }, () => { const r = R("souffle"); r.posture = [0, 1, 2, 3, 4, 5]; saveSess(); c.poIdx = -1; render(); });
      break;
    }
    case "po-ok": { const r = R("souffle"); r.posture = [0, 1, 2, 3, 4, 5]; saveSess(); cardGo(c.card + 1); break; }
    case "said-w2": { const r = R("grenier"); r.said = r.said || {}; r.said[b.dataset.id] = true; saveSess(); cardGo(c.card + 1); break; }
    case "budget2": { const r = R(b.dataset.id); r.budget = Number(b.dataset.v); saveSess(); render(); break; }
    case "prep2": if (!c.prepT0) { c.prepT0 = Date.now(); b.innerHTML = '<span data-tick="prep">30 s de préparation</span>'; Voice.play("ui:prep"); } break;
    case "listen2": { const r = R("atelier"); freeze("atelier"); b.disabled = true; b.querySelector("span:last-child").textContent = "Écoutez…"; if (!Voice.play("ec:" + c.info.w, 1, () => { r.heard = (r.heard || 0) + 1; saveSess(); render(); })) { b.disabled = false; toast("Audio indisponible : lisez le texte."); } break; }
    case "show-ans": { const r = R("atelier"), i = b.dataset.i; r["sh" + i] = true; saveSess(); render(); Voice.play("ecr:" + c.info.w + ":" + i); break; }
    case "vic": { const r = R("feu"); r.vics = r.vics || []; const v = b.dataset.v; r.vics = r.vics.includes(v) ? r.vics.filter(x => x !== v) : r.vics.concat(v); r.vic = r.vics.join(" ; "); saveSess(); render(); break; }
    case "mission-quick": S.mq = {}; render(); break;
    case "mq": S.mq = S.mq || {}; S.mq[b.dataset.k] = Number(b.dataset.v); render(); break;
    case "mq-save": {
      const w = Number(b.dataset.w); S.profile.missions = S.profile.missions || {}; S.profile.missions[w] = { pre: S.mq.pre, post: S.mq.post, note: "", at: Date.now() }; S.mq = null; saveProfile(); render(); toast("Mission enregistrée : une marche de plus.");
      if (coachOn()) { try { S.profile.missions[w].ai = await coachMission(MISSIONS[w], S.profile.missions[w]); saveProfile(); } catch (e) { } }
      break;
    }
    case "tech-play": S.techAsk = true; render(); if (!Voice.play("ui:welcome")) { S.techNoVoice = true; render(); } break;
    case "tech-voice": { S.profile.tech = S.profile.tech || {}; if (b.dataset.v === "1") { S.profile.tech.voice = true; S.techNoVoice = false; } else S.techNoVoice = true; S.techAsk = false; saveProfile(); render(); break; }
    case "budget": { const r = R(b.dataset.id); r.budget = Number(b.dataset.v); saveSess(); const tb = $("#tb-" + b.dataset.id); if (tb) tb.innerHTML = timeBox(b.dataset.id, ctx().boxes && ctx().boxes[b.dataset.id]); break; }
    case "stage": stageStart(b.dataset.id, null); break;
    case "funnel": stageStart(b.dataset.id, FUNNEL.slice()); break;
    case "stage-stop": stageStop(false); break;
    case "stage-cancel": stageStop(true); break;
    case "intent": { const r = R("souffle"); r.intent = b.dataset.v; saveSess(); render(); break; }
    case "charpente": { const r = R("impro"); r.ch = b.dataset.v; r.sc = {}; saveSess(); render(); break; }
    case "mission-open": { const w = Number(b.dataset.w); S.mOpen = S.mOpen === w ? undefined : w; render(); break; }
    case "mission-save": {
      const w = Number(b.dataset.w), k = "m" + w, f = S.mForm || {};
      const md = { pre: Number(f[k + "pre"] ?? 6), post: Number(f[k + "post"] ?? 4), note: (f[k + "note"] || "").trim(), at: Date.now() };
      S.profile.missions = S.profile.missions || {}; S.profile.missions[w] = md; saveProfile(); render();
      toast("Mission enregistrée. Une marche de plus sur l’échelle du courage.");
      if (coachOn()) { try { md.ai = await coachMission(MISSIONS[w], md); saveProfile(); render(); } catch (e) { } }
      break;
    }
    case "ev-add": {
      const g = id => (($("#" + id) || {}).value || "").trim();
      if (!g("ev-titre")) { toast("Donnez un intitulé à votre échéance."); break; }
      const e = { id: Date.now().toString(36), type: g("ev-type"), titre: g("ev-titre"), date: g("ev-date"), public: g("ev-public"), kfd: { know: g("ev-know"), feel: g("ev-feel"), do: g("ev-do") }, duree: g("ev-duree"), points: g("ev-points"), obj: g("ev-obj"), created: Date.now() };
      S.events.list = (S.events.list || []).concat(e).slice(-30); saveEvents(); render(); toast("Échéance enregistrée. Elle devient le fil rouge de vos séances dans les dix jours qui la précèdent.");
      break;
    }
    case "ev-prep": {
      const e = (S.events.list || []).find(x => x.id === b.dataset.id); if (!e) break;
      e.busy = true; render();
      try { e.plan = await coachEvent(e); } catch (err) { toast(coachErr(err)); }
      e.busy = false; saveEvents(); render(); break;
    }
    case "rehearse": {
      const e = (S.events.list || []).find(x => x.id === b.dataset.id); if (!e) break;
      Media.clear("libre"); S.free = { n: 0, free: true, res: { libre: { sujet: e.type + " : " + e.titre + (e.public ? ", devant " + e.public : "") + (e.kfd && e.kfd.do ? ". Objectif : " + e.kfd.do : "") + (e.plan && e.plan.angle ? ". Angle retenu : " + e.plan.angle : "") } }, boxes: {} };
      S.libTab = "studio"; S.route = "lib"; render(); break;
    }
    case "ev-debrief": {
      const e = (S.events.list || []).find(x => x.id === b.dataset.id); if (!e) break;
      const k = "e" + e.id, f = S.mForm || {};
      e.debrief = { pre: Number(f[k + "pre"] ?? 6), post: Number(f[k + "post"] ?? 4), note: (f[k + "note"] || "").trim(), at: Date.now() };
      saveEvents(); render(); toast("Débrief enregistré."); break;
    }
    case "ev-del-ask": S.evDel = b.dataset.id; render(); break;
    case "ev-del-no": S.evDel = null; render(); break;
    case "ev-del": S.events.list = (S.events.list || []).filter(x => x.id !== b.dataset.id); S.evDel = null; saveEvents(); render(); break;
    case "libtab": if (S.libTab === "studio" && b.dataset.tab !== "studio") Media.clear("libre"); S.libTab = b.dataset.tab; render(); break;
    case "free-reset": Media.clear("libre"); S.free = { n: 0, free: true, res: {}, boxes: {} }; render(); break;
    case "ask": await askCoach(); break;
    case "ask-stop": if (askCtl) askCtl.abort(); break;
    case "reset-ask": $("#reset-zone").hidden = false; break;
    case "reset-no": $("#reset-zone").hidden = true; break;
    case "reset-do": {
      const keys = ["profile", "srs"]; for (let n = 1; n <= TOTAL; n++) keys.push(sessKey(n), planKey(n));
      S.profile = newProfile(); S.srs = { items: {} }; S.cur = null;
      if (Store.mode === "db") { keys.forEach(k => { try { Store.ref(k).delete(); } catch (_) { } }); }
      keys.forEach(k => { try { localStorage.removeItem(Store.lk(k)); } catch (_) { } });
      saveProfile(); S.route = "home"; render(); toast("Progression réinitialisée."); break;
    }
  }
});

// ---------- Saisie ----------
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.mf) { S.mForm = S.mForm || {}; S.mForm[el.dataset.mf] = el.value; const o = el.nextElementSibling; if (o && o.tagName === "OUTPUT") o.textContent = el.value; return; }
  if (el.id === "lib-q") { S.libQ = el.value; clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $("#lib-q"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) { } } }, 350); return; }
  const bind = el.dataset.bind; if (!bind) return;
  const [st, ...rest] = bind.split(".");
  setPath(R(st), rest.join("."), el.value);
  saveSess();
  if (rest[0] !== "sujet" && st !== "grenier" && st !== "feu") freeze(st);
  if (rest[0] === "text") { clearTimeout(el._t); el._t = setTimeout(() => { const m = $("#m-" + st); if (m) m.innerHTML = metricsBlock(st); }, 300); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.bind === "grenier.pick" && S.cur) { R("grenier").pick = el.value; saveSess(); render(); return; }
  if (el.dataset.media === "tech" && el.files && el.files[0]) { S.profile.tech = S.profile.tech || {}; S.profile.tech.cam = true; S.pickHelp = null; if (S.pick) S.pick.done = true; el.value = ""; saveProfile(); render(); toast("Caméra opérationnelle : la vidéo de test est déjà effacée."); return; }
  if (el.dataset.media && el.files && el.files[0]) { runMedia(el.dataset.media, el.files[0]); return; }
  if (el.dataset.photo && el.files && el.files[0] && S.cur) { postureCheck(el.files[0]); return; }
});

// ---------- Simulation ----------
function simRules(sc, nego) {
  return coachCtx() + "\n\nJEU DE RÔLE " + (nego ? "DE NÉGOCIATION" : "DE CONVERSATION") + ". Tu incarnes : " + sc.role + ". " + (sc.contexte ? "Contexte : " + sc.contexte + ". " : "") +
    "L’apprenant poursuit cet objectif, que ton personnage ignore : " + sc.objectif + ". Reste strictement dans ton personnage : réponds en une à trois phrases, comme à l’oral, avec tes propres intérêts, réticences et émotions. Ne cède pas trop vite, mais reste réaliste : récompense une bonne écoute, une question ouverte, une reformulation ou une proposition créative. Ne donne aucun conseil et ne sors jamais du rôle. Écris seulement la réplique, sans guillemets ni didascalie. Commence maintenant par la première réplique de ton personnage.";
}
function curScenario() { const c = S.cur, L = c.info.W.rel, r = R("atelier"); return (r.chat && r.chat.sc) || (c.plan && c.plan.scenario) || { role: L.role, contexte: "", objectif: L.objectif }; }
async function simCall(turns) {
  c_simBusy = true; render();
  try {
    const { text } = await SAMPLE(turns, { modelTier: "quick", cache: false, onText: ({ text }) => { const l = $("#sim-live"); if (l) l.textContent = text; } });
    return text.trim();
  } finally { c_simBusy = false; }
}
async function simStart(nego) {
  const r = R("atelier"), sc = curScenario();
  r.chat = { turns: [{ role: "user", content: simRules(sc, nego) }], nego, sc };
  try { const t = await simCall(r.chat.turns); r.chat.turns.push({ role: "assistant", content: t }); }
  catch (e) { toast(coachErr(e)); r.chat = null; }
  saveSess(); render();
}
async function simSend() {
  const r = R("atelier"), inp = $("#sim-in"); const v = (inp && inp.value || "").trim();
  if (!v || !r.chat || c_simBusy) return;
  r.chat.turns.push({ role: "user", content: v });
  try { const t = await simCall(r.chat.turns); r.chat.turns.push({ role: "assistant", content: t }); }
  catch (e) { toast(coachErr(e)); r.chat.turns.pop(); }
  saveSess(); render(); const ch = $("#chat"); if (ch) ch.scrollIntoView({ block: "end" });
}
async function simEnd(nego, btn) {
  const r = R("atelier"); if (!r.chat) return;
  const sc = curScenario();
  const transcript = r.chat.turns.slice(1).map(t => (t.role === "user" ? "APPRENANT : " : "INTERLOCUTEUR : ") + t.content).join("\n");
  btn.disabled = true; btn.textContent = "Le coach prépare le débrief…";
  try { r.ai = await coachDebrief({ scenario: sc, transcript, nego }); saveSess(); } catch (e) { toast(coachErr(e)); }
  render();
}

// ---------- Demander au coach ----------
let askCtl = null;
async function askCoach() {
  const q = ($("#ask-q") || {}).value || ""; if (!q.trim()) return;
  const out = $("#ask-out"), stop = $("#ask-stop");
  askCtl = new AbortController(); out.textContent = "Le coach réfléchit…"; if (stop) stop.hidden = false;
  try { const { text } = await coachAsk(q, ({ text }) => { out.textContent = text; }, askCtl.signal); out.textContent = text; }
  catch (e) { out.textContent = (e && e.text) || ""; if (e && e.code !== "cancelled") toast(coachErr(e)); }
  if (stop) stop.hidden = true;
}

// ---------- Démarrage ----------
async function boot() {
  const lp = Store.readLocal("profile"); if (lp) S.profile = mergeProfile(lp);
  const ls = Store.readLocal("srs"); if (ls && ls.items) S.srs = ls;
  const le = Store.readLocal("events"); if (le && Array.isArray(le.list)) S.events = le;
  render();
  await Promise.all([Store.connect(), initCoach()]);
  if (Store.mode === "db") {
    const [p, s, ev] = await Promise.all([Store.get("profile"), Store.get("srs"), Store.get("events")]);
    if (p) S.profile = mergeProfile(p);
    if (s && s.items) S.srs = s;
    if (ev && Array.isArray(ev.list)) S.events = ev;
    try { await Store.get(sessKey(nextSession())); } catch (e) { }
  }
  S.ready = true;
  if (S.route !== "seance") render(); else softRender();
}
async function postureCheck(file) {
  const r = R("souffle"); Media.set("posture", file); r.pAi = "wait"; render();
  try { r.pAi = await coachPosture(file); } catch (e) { r.pAi = null; toast(coachErr(e)); }
  saveSess(); render();
}
window.addEventListener("pagehide", () => { Media.clearAll(); if (S.cur) { stopChrono(); Store.writeLocal(sessKey(S.cur.n), sessDoc()); } });
boot();

</script>
